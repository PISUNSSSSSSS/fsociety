  showErr();
  buildNote();
  if(cur==="admin"&&allUsers.length)renderUsers();
}
function setLang(l){
  if(l===lang)return;
  lang=l;save("lang",l);
  $("app").classList.add("swap");
  setTimeout(()=>{applyLang();$("app").classList.remove("swap")},250);
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

function setAva(el,src,spin){
  el.textContent="";
  if(src||spin){
    const im=document.createElement("img");
    im.alt="";
    im.src=src||"pic1.jpg";
    if(!src&&spin)im.className="spin";
    el.appendChild(im);
  }else{
    el.innerHTML=USER_ICON;
  }
}
function renderUser(){
  const role=user?user.role:"user";
  setAva($("me"),user&&user.avatar,role==="owner");
  setAva($("pava"),user&&user.avatar,role==="owner");
  ["me","pava"].forEach(id=>{
    const e=$(id);
    e.classList.remove("owner","admin","user");
    e.classList.add(role);
  });
  $("badge").textContent=role.toUpperCase();
  $("badge").className="badge "+role;
  $("pnick").textContent=user?user.nick:"";
  $("psid").textContent=(user&&user.sid)?"ID: "+user.sid:"";
  $("pmail").textContent=user?user.email:"";
  $("admbtn").style.display=isStaff()?"":"none";
}
function setPrev(src){setAva($("prev"),src,false)}
async function loadUser(u){
  const meta=u.user_metadata||{};
  let p=null;
  try{
    const r=await sb.from("profiles").select("short_id,nick,avatar,role").eq("id",u.id).maybeSingle();
    p=r.data;
  }catch(e){}
  user={
    id:u.id,
    email:u.email||"",
    nick:(p&&p.nick)||meta.nick||(u.email||"user").split("@")[0],
    avatar:(p&&p.avatar)||null,
    sid:p?p.short_id:null,
    role:(p&&p.role)||"user"
  };
}
function clearForm(){
  $("email").value="";$("pass").value="";$("nick").value="";$("code").value="";
  pending=null;setPrev(null);setErr(null);
}

const back=$("back");
const btns=document.querySelectorAll("nav button");
function go(name){
  if(name==="admin"&&!isStaff())name="home";
  cur=name;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===name));
  btns.forEach(b=>b.classList.toggle("on",b.dataset.go===name));
  back.classList.toggle("show",name!=="home");
  if(name==="home")buildNote();
  if(name==="admin")loadUsers();
}
btns.forEach(b=>b.onclick=()=>go(b.dataset.go));
back.onclick=()=>go(cur==="admin"?"profile":"home");
$("me").onclick=()=>go(user?"profile":"register");
$("admbtn").onclick=()=>go("admin");

function cropToData(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{
        const c=document.createElement("canvas");
        c.width=c.height=160;
        const s=Math.min(img.width,img.height);
        c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
        res(c.toDataURL("image/jpeg",0.8));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
$("choose").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];
  e.target.value="";
  if(!f)return;
  try{pending=await cropToData(f);setPrev(pending)}catch(err){toast(t("err_generic"))}
};
$("chava").onclick=()=>$("file2").click();
$("file2").onchange=async e=>{
  const f=e.target.files[0];
  e.target.value="";
  if(!f||!user||!sb)return;
  try{
    const data=await cropToData(f);
    const r=await sb.from("profiles").update({avatar:data}).eq("id",user.id);
    if(r.error)throw r.error;
    user.avatar=data;
    renderUser();
    toast(t("saved"));
  }catch(err){toast(t("err_generic"))}
};

$("swap").onclick=()=>{
  mode=(mode==="reg")?"login":(mode==="login")?"reg":(mode==="forgot")?"login":"forgot";
  setErr(null);
  applyMode();
};
$("forgot").onclick=()=>{mode="forgot";setErr(null);applyMode()};

function mapErr(e){
  const m=(e.message||"").toLowerCase();
  if(m.indexOf("banned")>-1)return "err_banned";
  if(m.indexOf("captcha")>-1)return "err_captcha";
  if(m.indexOf("invalid login")>-1)return "err_bad";
  if(m.indexOf("already registered")>-1)return "err_exists";
  if(m.indexOf("different")>-1)return "err_same";
  if(m.indexOf("at least")>-1)return "err_pass";
  if(m.indexOf("rate limit")>-1||m.indexOf("security purposes")>-1)return "err_rate";
  if(m.indexOf("sending")>-1)return "err_mail";
  if(m.indexOf("database error")>-1)return "err_generic";
  return null;
}
function busy(b){
  $("go").disabled=b;
  if(b)$("go").textContent=t("wait");else applyMode();
}

function fmtUntil(b){
  if(!b.expires_at)return t("ban_forever");
  return t("ban_until")+" "+new Date(b.expires_at).toLocaleString(locale(),{dateStyle:"short",timeStyle:"short"});
}
function showBan(b){
  const lines=[];
  if(b.reason)lines.push(b.reason);
  lines.push(fmtUntil(b));
  $("bantext").textContent=lines.join("\n");
  $("banscreen").classList.add("show");
  try{if(sb)Promise.resolve(sb.auth.signOut()).catch(function(){})}catch(e){}
  user=null;
  renderUser();
}
async function checkBan(){
  if(!sb)return false;
  try{
    const r=await sb.rpc("ban_status",{d:deviceId()});
    if(r.error||!r.data||!r.data.length)return false;
    showBan(r.data[0]);
    return true;
  }catch(e){return false}
}
async function afterAuth(){
  try{await sb.rpc("log_device",{d:deviceId()})}catch(e){}
  return await checkBan();
}

async function doForgot(email){
  if(cfId!==null&&!cfToken){setErr("err_captcha");return}
  setErr(null);
  busy(true);
  try{
    const r=await sb.auth.resetPasswordForEmail(email,{captchaToken:cfToken||undefined});
    if(r.error){setErr(mapErr(r.error),r.error.message);return}
    mode="reset";
    $("code").value="";
    $("pass").value="";
    toast(t("code_sent"));
  }catch(e){
    setErr("err_net");
  }finally{
    busy(false);
    resetCaptcha();
  }
}
async function doReset(email){
  const code=$("code").value.trim();
  const np=$("pass").value;
  if(!/^\d{6}$/.test(code)){setErr("err_code");return}
  if(np.length<6){setErr("err_pass");return}
  setErr(null);
  busy(true);
  try{
    const v=await sb.auth.verifyOtp({email:email,token:code,type:"recovery"});
    if(v.error){setErr(mapErr(v.error)||"err_code");return}
    const u=await sb.auth.updateUser({password:np});
    if(u.error){setErr(mapErr(u.error),u.error.message);return}
    const usr=(u.data&&u.data.user)||(v.data&&v.data.user);
    await loadUser(usr);
    renderUser();
    mode="login";
    clearForm();
    toast(t("pass_changed"));
    if(await afterAuth())return;
    go("profile");
  }catch(e){
    setErr("err_net");
  }finally{
    busy(false);
  }
}

$("go").onclick=async()=>{
  if(!sb){setErr("err_net");return}
  const email=$("email").value.trim();
  if(!email){setErr("err_email");return}
  if(mode==="forgot")return doForgot(email);
  if(mode==="reset")return doReset(email);
  const pass=$("pass").value;
  if(pass.length<6){setErr("err_pass");return}
  let nick="";
  if(mode==="reg"){
    nick=$("nick").value.trim();
    if(nick.length<2||nick.length>20){setErr("err_nick");return}
  }
  if(cfId!==null&&!cfToken){setErr("err_captcha");return}
  setErr(null);
  busy(true);
  try{
    if(mode==="reg"){
      const chk=await sb.rpc("nick_free",{n:nick});
      if(chk.error){setErr("err_net");return}
      if(chk.data===false){setErr("err_nick_taken");return}
    }
    const res=mode==="reg"
      ?await sb.auth.signUp({email:email,password:pass,options:{data:{nick:nick},captchaToken:cfToken||undefined}})
      :await sb.auth.signInWithPassword({email:email,password:pass,options:{captchaToken:cfToken||undefined}});
    if(res.error){setErr(mapErr(res.error),res.error.message);return}
    const u=res.data&&res.data.user;
    const s=res.data&&res.data.session;
    if(!u||!s){setErr("check_mail");return}
    if(mode==="reg"&&pending){
      try{await sb.from("profiles").update({avatar:pending}).eq("id",u.id)}catch(e){}
    }
    await loadUser(u);
    renderUser();
    clearForm();
    if(await afterAuth())return;
    go("profile");
  }catch(e){
    setErr("err_net");
  }finally{
    busy(false);
    resetCaptcha();
  }
};

async function doLogout(){
  try{if(sb)await sb.auth.signOut()}catch(e){}
  user=null;
  clearForm();
  renderUser();
  go("home");
}
$("logout").onclick=()=>askConfirm(t("logout_q"),doLogout);

async function loadUsers(){
  $("ulist").textContent="";
  $("utotal").textContent=t("loading");
  try{
    const res=await Promise.all([sb.rpc("admin_users"),sb.rpc("admin_bans")]);
    if(res[0].error)throw res[0].error;
    if(res[1].error)throw res[1].error;
    allUsers=res[0].data||[];
    bansByUser={};
    (res[1].data||[]).forEach(b=>{bansByUser[b.user_id]=b});
    renderUsers();
  }catch(e){
    $("utotal").textContent=t("err_generic");
  }
}
function renderUsers(){
  const q=$("usearch").value.trim().toLowerCase();
  const list=$("ulist");
  list.textContent="";
  const rows=allUsers.filter(u=>!q||String(u.short_id).indexOf(q)>-1||u.nick.toLowerCase().indexOf(q)>-1||(u.email||"").toLowerCase().indexOf(q)>-1);
  $("utotal").textContent=t("total").replace("{n}",allUsers.length);
  if(!rows.length){
    const p=document.createElement("p");
    p.textContent=t("no_users");
    list.appendChild(p);
    return;
  }
  const me=user?user.role:"user";
  rows.forEach(u=>{
    const card=document.createElement("div");
    card.className="ucard glass";
    const top=document.createElement("div");
    top.className="urow";
    const name=document.createElement("b");
    name.textContent="#"+u.short_id+" "+u.nick;
    const bd=document.createElement("span");
    bd.className="badge "+u.role;
    bd.textContent=u.role.toUpperCase();
    top.appendChild(name);
    top.appendChild(bd);
    const mail=document.createElement("div");
    mail.className="mail";
    mail.textContent=u.email;
    const date=document.createElement("div");
    date.className="mail";
    date.textContent=new Date(u.created_at).toLocaleDateString(locale());
    card.appendChild(top);
    card.appendChild(mail);
    card.appendChild(date);
    const b=bansByUser[u.id];
    if(b){
      const bi=document.createElement("div");
      bi.className="baninfo";
      bi.textContent=t("banned")+" · "+fmtUntil(b)+(b.reason?" · "+b.reason:"")+" · IP: "+b.ips+" · "+t("devices")+": "+b.devices;
      card.appendChild(bi);
    }
    const acts=document.createElement("div");
    acts.className="uacts";
    if(me==="owner"&&u.role!=="owner"){
      const rb=document.createElement("button");
      rb.className="mini";
      rb.textContent=t(u.role==="admin"?"remove_admin":"make_admin");
      rb.onclick=()=>setRole(u.id,u.role==="admin"?"user":"admin");
      acts.appendChild(rb);
    }
    const canMod=u.role!=="owner"&&user&&u.id!==user.id&&(me==="owner"||(me==="admin"&&u.role==="user"));
    if(canMod){
      if(b){
        const eb=document.createElement("button");
        eb.className="mini";
        eb.textContent=t("ban_edit_btn");
        eb.onclick=()=>openBan("edit",u,b);
        acts.appendChild(eb);
        const ub=document.createElement("button");
        ub.className="mini";
        ub.textContent=t("unban_btn");
        ub.onclick=()=>askConfirm(t("unban_q").replace("{n}",u.nick),()=>unban(b.grp));
        acts.appendChild(ub);
      }else{
        const bb=document.createElement("button");
        bb.className="mini danger";
        bb.textContent=t("ban_btn");
        bb.onclick=()=>openBan("new",u,null);
        acts.appendChild(bb);
      }
      const db=document.createElement("button");
      db.className="mini danger";
      db.textContent=t("delete_user");
      db.onclick=()=>askConfirm(t("delete_q").replace("{n}",u.nick),()=>delUser(u.id));
      acts.appendChild(db);
    }
    if(acts.children.length)card.appendChild(acts);
    list.appendChild(card);
  });
}
$("usearch").oninput=renderUsers;
async function setRole(id,role){
  try{
    const r=await sb.rpc("admin_set_role",{target:id,new_role:role});
    if(r.error)throw r.error;
    toast(t("saved"));
    loadUsers();
  }catch(e){toast(t("err_generic"))}
}
async function delUser(id){
  try{
    const r=await sb.rpc("admin_delete_user",{target:id});
    if(r.error)throw r.error;
    toast(t("saved"));
    loadUsers();
  }catch(e){toast(t("err_generic"))}
}
async function unban(grp){
  try{
    const r=await sb.rpc("admin_unban",{p_grp:grp});
    if(r.error)throw r.error;
    toast(t("saved"));
    loadUsers();
  }catch(e){toast(t("err_generic"))}
}

function syncCustom(){$("bcustom").style.display=$("bdur").value==="custom"?"":"none"}
$("bdur").onchange=syncCustom;
function openBan(m,u,b){
  banCtx={mode:m,u:u,b:b};
  $("btitle").textContent=t(m==="new"?"ban_title":"ban_edit_title").replace("{n}",u.nick);
  buildDurOptions();
  if(m==="edit"){
    if(!b.expires_at){
      $("bdur").value="perm";
      $("bcustom").value="";
    }else{
      $("bdur").value="custom";
      $("bcustom").value=Math.max(1,Math.ceil((new Date(b.expires_at).getTime()-Date.now())/60000));
    }
    $("breason").value=b.reason||"";
  }else{
    $("bdur").value="1440";
    $("bcustom").value="";
    $("breason").value="";
    $("bip").checked=false;
    $("bdev").checked=false;
  }
  const show=m==="new"?"":"none";
  $("bipw").style.display=show;
  $("bdevw").style.display=show;
  syncCustom();
  $("bmodal").classList.add("show");
}
$("byes").onclick=async()=>{
  if(!banCtx)return;
  const v=$("bdur").value;
  let mins=null;
  if(v==="custom"){
    mins=parseInt($("bcustom").value,10);
    if(!(mins>0)){toast(t("ban_bad_dur"));return}
  }else if(v!=="perm"){
    mins=parseInt(v,10);
  }
  const reason=$("breason").value.trim()||null;
  const ctx=banCtx;
  $("bmodal").classList.remove("show");
  banCtx=null;
  try{
    let r;
    if(ctx.mode==="new"){
      r=await sb.rpc("admin_ban",{p_target:ctx.u.id,p_minutes:mins,p_reason:reason,p_ip:$("bip").checked,p_device:$("bdev").checked});
    }else{
      r=await sb.rpc("admin_edit_ban",{p_grp:ctx.b.grp,p_minutes:mins,p_reason:reason});
    }
    if(r.error)throw r.error;
    toast(t("saved"));
    loadUsers();
  }catch(e){toast(t("err_generic"))}
};
$("bno").onclick=()=>{$("bmodal").classList.remove("show");banCtx=null};
$("bmodal").onclick=e=>{if(e.target===$("bmodal"))$("bno").onclick()};

function renderCaptcha(){
  if(cfId!==null||!window.turnstile)return;
  cfId=turnstile.render("#cf",{sitekey:TURNSTILE_SITE_KEY,theme:"dark",callback:function(tk){cfToken=tk},"expired-callback":function(){cfToken=null},"error-callback":function(){cfToken=null}});
}
function resetCaptcha(){
  cfToken=null;
  try{if(cfId!==null)turnstile.reset(cfId)}catch(e){}
}
window.addEventListener("load",renderCaptcha);

async function boot(){
  try{
    if(sb){
      const r=await sb.auth.getSession();
      if(r.data&&r.data.session)await loadUser(r.data.session.user);
    }
  }catch(e){}
  renderUser();
  if(user)await afterAuth();else await checkBan();
}

setPrev(null);
renderUser();
applyLang();
boot();
</script>
</body>
</html>
