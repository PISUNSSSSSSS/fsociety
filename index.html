#dmatt{flex:none;padding:9px 11px;display:flex;align-items:center;justify-content:center}

/* ---------- редактор ---------- */
.etools{display:flex;gap:4px;align-items:center;overflow-x:auto;width:100%;flex:none;padding:1px 0;scrollbar-width:none}

.sendrow textarea{flex:1;min-width:0;min-height:42px;max-height:130px;height:42px;padding:9px 14px;border-radius:18px;font-size:16px;line-height:1.35;resize:none;overflow-y:auto;box-sizing:border-box}

.rich blockquote{margin:4px 0;padding:6px 9px;border-left:3px solid rgba(147,197,253,.7);background:rgba(147,197,253,.08);border-radius:0 8px 8px 0}
.rich .spoiler{background:rgba(255,255,255,.14);color:transparent;border-radius:4px;padding:0 3px;cursor:pointer}
.rich .spoiler.open{color:inherit;background:rgba(255,255,255,.08)}

/* ---------- группы в мессенджере ---------- */
.dmtabs{width:100%;flex:none}
#dm .box>#groupnew{flex:none}
.grouplist{display:flex;flex-direction:column;gap:8px;width:100%;flex:1;min-height:0;overflow-y:auto}
.grouprow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;cursor:pointer;width:100%}

.gicon.lg{width:36px;height:36px;font-size:.95rem}
.grouph{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:16px;flex:none}
.grouph .dmwho{flex:1}

.groupchat{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px;width:100%}
.grouprow .dmunread{flex:none}
.gsub{font-size:.68rem;opacity:.55}

/* ---------- серверы ---------- */
#servers .box{max-width:520px;flex:1;min-height:0;height:100%;align-items:stretch}
.srvhome{display:flex;flex-direction:column;gap:10px;width:100%;flex:1;min-height:0}
.srvtop{display:flex;flex-direction:column;gap:8px;flex:none}
.srvactions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.srvlist{display:flex;flex-direction:column;gap:8px;width:100%;overflow-y:auto;flex:1;min-height:0}

.srvname{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srvmeta{font-size:.7rem;opacity:.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srvchat{display:flex;flex-direction:column;gap:8px;width:100%;flex:1;min-height:0}

.srvchannels{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px;flex:none;scrollbar-width:none}

.abar{display:flex;justify-content:center;width:100%}

#formmodal,#amodal{position:fixed;inset:0;z-index:26;background:rgba(0,0,0,.65);display:flex;overflow-y:auto;padding:16px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .25s ease}

.pickrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.06);width:100%;box-sizing:border-box}

.pickrow .grow{flex:1;min-width:0}
.pickrow .pname{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickrow .mini{flex:none}

/* ---------- «Богач», аватарки групп/серверов, медиа ---------- */
.richname{position:relative;display:inline-block;overflow:hidden;vertical-align:bottom;max-width:100%;padding:0 4px;border-radius:6px;background:linear-gradient(90deg,#b45309,#fde68a,#f59e0b,#fde68a,#b45309);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:800;animation:richshine 3s linear infinite;text-shadow:none}
.richname .rnm{position:relative;z-index:1}
.richname .rmoney{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.richname .rmoney i{position:absolute;top:-11px;font-style:normal;font-size:9px;line-height:1;color:#fbbf24;-webkit-text-fill-color:#fbbf24;font-weight:900;animation:richfall linear infinite;text-shadow:0 0 5px rgba(250,204,21,.8)}
@keyframes richfall{0%{transform:translateY(-9px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(26px) rotate(200deg);opacity:0}}
@keyframes richshine{to{background-position:250% 0}}
.gicon img,.srvicon img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
#groupatt,#srvatt{flex:none;padding:9px 11px;display:flex;align-items:center;justify-content:center}
#groupatt svg,#srvatt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wopt{position:relative;overflow:hidden}
.wopt .wdot{position:absolute;left:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--wd,#888);box-shadow:0 0 6px var(--wd,#888)}
@media(max-width:380px){
  #dock button{font-size:.58rem}
  #dock button>svg{width:20px;height:20px}
  .srvicon{width:38px;height:38px;font-size:1rem}
}

@keyframes introBg{0%,72%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes introText{
  0%{opacity:0;transform:scale(.4) rotateY(0);color:#fff}
  18%{opacity:1;transform:scale(1) rotateY(0);color:#fff;text-shadow:0 0 18px rgba(255,255,255,.8)}
  38%{opacity:1;transform:scale(1) rotateY(0);color:#fff;text-shadow:0 0 18px rgba(255,255,255,.8)}
  52%{opacity:1;transform:scale(1.08) rotateY(0);color:#ef4444;text-shadow:0 0 28px rgba(239,68,68,.95)}
  72%{opacity:1;transform:scale(1.15) rotateY(360deg);color:#ef4444;text-shadow:0 0 28px rgba(239,68,68,.95)}
  100%{opacity:0;transform:scale(16) rotateY(360deg);color:#ef4444}
}

function startWall(){
  cancelAnimationFrame(raf);
  const c=$("wall"),ctx=c.getContext("2d");
  ww=c.width=window.innerWidth;wh=c.height=window.innerHeight;

  if(wallId==="none"||!DRAW[wallId])return;
  if(wallId==="custom")wstate={img:loadWallImage(wallPath)};
  else wstate=INIT[wallId]?INIT[wallId]():null;
  let last=0;
  const loop=ts=>{
    raf=requestAnimationFrame(loop);
    if(document.hidden||ts-last<33)return;
    last=ts;
    DRAW[wallId](ctx,ww,wh,ts,wstate);
  };

function cropToData(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{
        const c=document.createElement("canvas");
        c.width=c.height=160;
        const s=Math.min(img.width,img.height);
        c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
        res(c.toDataURL("image/jpeg",0.8));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- безопасный markdown-lite и панель редактора ---------- */
function escHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function safeHref(u){
  u=String(u||"").trim();
  return /^https?:\/\/[^\s]+$/i.test(u)?u:"";
}
function mdInline(s){
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,txt,url)=>{
    const h=safeHref(url);
    return h?'<a href="'+h+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>':m;
  });
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,"$1<em>$2</em>");
  s=s.replace(/~~([^~\n]+?)~~/g,"<del>$1</del>");
  s=s.replace(/\|\|([^|\n]+?)\|\|/g,'<span class="spoiler">$1</span>');
  s=s.replace(/__([^_\n]+?)__/g,"<u>$1</u>");
  return s;
}
function mdHtml(text){
  const src=String(text==null?"":text).replace(/\r\n?/g,"\n");
  let s=escHtml(src);
  const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>{
    const ph="\uE000"+codes.length+"\uE001";
    codes.push("<code>"+c+"</code>");
    return ph;
  });
  const out=[],quote=[];
  const flush=()=>{
    if(quote.length){out.push("<blockquote>"+quote.map(mdInline).join("<br>")+"</blockquote>");quote.length=0}
  };
  s.split("\n").forEach(line=>{
    if(/^&gt;\s?/.test(line))quote.push(line.replace(/^&gt;\s?/,""));
    else{flush();out.push(mdInline(line))}
  });
  flush();
  let html=out.join("<br>");
  codes.forEach((c,i)=>{html=html.split("\uE000"+i+"\uE001").join(c)});
  return html;
}
function mdPlain(text){
  return String(text==null?"":text)
    .replace(/`([^`\n]+)`/g,"$1")
    .replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
    .replace(/\*\*([^*]+)\*\*/g,"$1")
    .replace(/~~([^~]+)~~/g,"$1")
    .replace(/\|\|([^|]+)\|\|/g,"$1")
    .replace(/__([^_]+)__/g,"$1")
    .replace(/\*([^*\n]+)\*/g,"$1")
    .replace(/^&gt;\s?/gm,"")
    .replace(/^>\s?/gm,"");
}
function setRich(el,text){el.innerHTML=mdHtml(text)}
const ED_OPS=[
  {op:"bold",label:"B",key:"ed_bold",cls:"b"},
  {op:"italic",label:"I",key:"ed_italic",cls:"i"},
  {op:"strike",label:"S",key:"ed_strike",cls:"s"},
  {op:"code",label:"</>",key:"ed_code",cls:""},
  {op:"quote",label:"❝",key:"ed_quote",cls:""},
  {op:"spoiler",label:"◉",key:"ed_spoiler",cls:""},
  {op:"link",label:"🔗",key:"ed_link",cls:""}
];
function resizeEditor(ta){
  if(!ta)return;
  ta.style.height="auto";
  ta.style.height=Math.min(Math.max(ta.scrollHeight,42),160)+"px";
}
function buildEditorTools(){
  Q(".etools").forEach(box=>{
    const id=box.dataset.for;
    const ta=$(id);
    box.textContent="";
    ED_OPS.forEach(o=>{
      const b=document.createElement("button");
      b.type="button";b.className="etool "+o.cls;b.textContent=o.label;
      b.title=t(o.key);b.setAttribute("aria-label",t(o.key));
      b.addEventListener("pointerdown",e=>e.preventDefault());
      b.onclick=()=>editorOp(id,o.op);
      box.appendChild(b);
    });
    if(ta&&!ta.dataset.edBound){
      ta.dataset.edBound="1";
      const remember=()=>{edSel[id]=[ta.selectionStart,ta.selectionEnd]};
      ["click","keyup","select","blur","input"].forEach(ev=>ta.addEventListener(ev,remember));
      ta.addEventListener("input",()=>resizeEditor(ta));
    }
    resizeEditor(ta);
  });
}
function editorOp(id,op){
  const ta=$(id);if(!ta)return;
  let s=ta.selectionStart,e=ta.selectionEnd;
  if(document.activeElement!==ta&&edSel[id]){s=edSel[id][0];e=edSel[id][1]}
  const val=ta.value;
  s=Math.max(0,Math.min(s,val.length));
  e=Math.max(s,Math.min(e,val.length));
  const sel=val.slice(s,e);
  let ns=s,ne=e;
  const wrap=(a,b)=>{
    const ins=sel?a+sel+b:a+b;
    ta.value=val.slice(0,s)+ins+val.slice(e);
    ns=s+a.length;ne=sel?ns+sel.length:s+a.length;
  };
  if(op==="bold")wrap("**","**");
  else if(op==="italic")wrap("*","*");
  else if(op==="strike")wrap("~~","~~");
  else if(op==="code")wrap("`","`");
  else if(op==="spoiler")wrap("||","||");
  else if(op==="link"){
    let url=window.prompt(t("ed_link_url"),"https://");
    if(url===null)return;
    url=url.trim();
    if(!safeHref(url)){toast(t("ed_link"));return}
    const label=(sel||t("ed_link_text")||url).replace(/[\[\]\n]/g," ");
    const ins="["+label+"]("+url+")";
    ta.value=val.slice(0,s)+ins+val.slice(e);
    ns=s;ne=s+ins.length;
  }else if(op==="quote"){
    const lineStart=val.lastIndexOf("\n",Math.max(0,s-1))+1;
    const block=val.slice(lineStart,e);
    const pref=block.split("\n").map(l=>l.indexOf("> ")===0?l:"> "+l).join("\n");
    ta.value=val.slice(0,lineStart)+pref+val.slice(e);
    ns=lineStart;ne=lineStart+pref.length;
  }
  ta.focus();
  try{ta.setSelectionRange(ns,ne)}catch(err){}
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

async function chatLoadFull(){
  if(!chatRoom||!sb)return;
  const room=chatRoom;
  chatBusy=true;
  try{
    const r=await sb.rpc("chat_get",{p_room:room,p_after:0,p_limit:50});
    if(r.error)throw r.error;
    if(room!==chatRoom)return;
    const rows=(r.data||[]).slice().sort((a,b)=>Number(a.id)-Number(b.id));
    chatRows=rows;chatLastId=rows.length?Number(rows[rows.length-1].id):0;
    renderMsgs();
  }catch(e){}
  finally{chatBusy=false}
}
async function chatPoll(){
  if(!chatRoom||!sb||chatBusy)return;
  const room=chatRoom;
  chatBusy=true;
  try{
    let after=chatLastId;
    for(let i=0;i<4;i++){
      const r=await sb.rpc("chat_get",{p_room:room,p_after:after,p_limit:100});
      if(r.error)throw r.error;
      if(room!==chatRoom)return;
      const rows=r.data||[];
      if(!rows.length)break;
      rows.forEach(addOrUpdate);
      after=Number(rows[rows.length-1].id);
      chatLastId=Math.max(chatLastId,after);
      if(rows.length<100)break;
    }
    if(++chatPollTick%10===0)await chatSyncFlags();
  }catch(e){}
  finally{chatBusy=false}
}
async function chatSyncFlags(){
  if(!chatRoom||!sb)return;
  const room=chatRoom;
  try{
    const r=await sb.rpc("chat_get",{p_room:room,p_after:0,p_limit:50});
    if(r.error)return;
    if(room!==chatRoom)return;
    (r.data||[]).forEach(m=>{
      const old=chatRows.find(x=>String(x.id)===String(m.id));
      if(old&&(!!old.deleted!==!!m.deleted||old.body!==m.body||old.edited_at!==m.edited_at))addOrUpdate(m);
    });
  }catch(e){}
}

function shrinkImage(file,max,q){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",q);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

async function chatSend(){
  if(!chatRoom||!user||!sb)return;
  const inp=$("msgin");
  const txt=inp.value.trim();
  if(!txt&&!chatImg)return;
  const img=chatImg,rep=chatReply;
  const tmp="tmp"+Date.now()+Math.random().toString(36).slice(2,6);
  const m={id:tmp,user_id:user.id,nick:user.nick,role:user.role,body:txt,image:img?img.url:null,
    reply_to:rep?rep.id:null,reply_nick:rep?rep.nick:null,reply_excerpt:rep?rep.excerpt:null,
    created_at:new Date().toISOString(),deleted:false,pending:true};
  inp.value="";setChatImg(null);setReplying(null);
  addOrUpdate(m);
  scrollBottom(true);
  const args={p_room:chatRoom,p_body:txt,p_device:deviceId()};
  if(rep)args.p_reply_to=rep.id;
  if(img)args.p_image=img.url;
  let ok=false,errMsg="",sentId=0;
  for(let attempt=0;attempt<3&&!ok;attempt++){
    try{
      const r=await sb.rpc("chat_send",args);
      if(r.error)throw r.error;
      ok=true;
      if(r.data)sentId=Number(r.data);
      if(sentId)chatLastId=Math.max(chatLastId,sentId);
    }catch(e){
      errMsg=((e&&e.message)||"").toLowerCase();
      if(errMsg.indexOf("slow")>-1){await wait(500*(attempt+1));continue}
      break;
    }
  }
  removeMsg(tmp);
  if(!ok){
    inp.value=txt;if(img)setChatImg(img);
    toast(t(errMsg.indexOf("slow")>-1?"chat_slow":errMsg.indexOf("banned")>-1?"err_banned":"err_generic"));
    return;
  }
  if(sentId){
    m.id=sentId;m.pending=false;
    addOrUpdate(m);
  }
  if(sentId&&rep){
    const tr=chatRows.find(x=>String(x.id)===String(rep.id));
    if(tr&&tr.user_id&&tr.user_id!==user.id){
      try{sb.rpc("chat_notify_reply",{p_target:tr.user_id,p_room:chatRoom,p_text:txt}).catch(()=>{})}catch(e){}
    }
  }
  await chatPoll();
}

    if(m){m.deleted=true;addOrUpdate(m)}

  }catch(e){toast(t("err_generic"))}
}

async function openThread(id,keep){
  forumThreadId=id;
  if(!keep)go("thread");
  if(!keep){$("th_head").textContent=t("loading");$("th_body").textContent="";$("th_replies").textContent=""}
  try{
    const res=await Promise.all([
      sb.rpc("forum_thread",{p_id:id}),
      sb.rpc("forum_replies",{p_thread:id})
    ]);
    if(res[0].error)throw res[0].error;
    if(res[1].error)throw res[1].error;
    const th=(res[0].data||[])[0];
    if(!th){toast(t("err_generic"));forumThreadId=null;go("forum");return}
    renderThread(th,res[1].data||[]);
  }catch(e){$("th_head").textContent=t("err_generic")}
}

/* ---------- файлы форума ---------- */
const MAX_FILE=5*1024*1024*1024;
const TUS_MIN=20*1024*1024;
const TUS_SRC="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js";
function fmtSize(n){
  n=Number(n)||0;
  if(n<1024)return n+" B";
  if(n<1048576)return Math.round(n/1024)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(1)+" MB";
  return (n/1073741824).toFixed(2)+" GB";
}
function safeName(n){return (n||"file").replace(/[^\w.\-]+/g,"_").slice(-40)}
function tooLargeErr(err){
  try{
    if(err&&(err.status===413||err.statusCode===413))return true;
    if(err&&err.originalResponse&&err.originalResponse.getStatus&&err.originalResponse.getStatus()===413)return true;
  }catch(e){}
  return false;
}
function loadTus(){
  if(window.tus)return Promise.resolve(window.tus);
  if(window.__tusLoad)return window.__tusLoad;
  window.__tusLoad=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=TUS_SRC;
    s.onload=()=>window.tus?res(window.tus):rej(new Error("tus"));
    s.onerror=()=>rej(new Error("tus"));
    document.head.appendChild(s);
  });
  return window.__tusLoad;
}
async function uploadBig(blob,name,path,type,onProgress,bucket){
  const tus=await loadTus();
  const g=await sb.auth.getSession();
  const tok=g&&g.data&&g.data.session&&g.data.session.access_token;
  if(!tok)throw new Error("auth");
  const file=blob instanceof File?blob:new File([blob],name,{type:type});
  return new Promise((res,rej)=>{
    const up=new tus.Upload(file,{
      endpoint:SUPABASE_URL+"/storage/v1/upload/resumable",
      retryDelays:[0,3000,6000,12000,25000,60000],
      headers:{authorization:"Bearer "+tok,"x-upsert":"false"},
      uploadDataDuringCreation:true,
      removeFingerprintOnSuccess:true,
      metadata:{bucketName:bucket||"forum",objectName:path,contentType:type,cacheControl:"31536000"},
      chunkSize:6*1024*1024,
      onError:e=>rej(e),
      onProgress:(b,t)=>{if(onProgress)onProgress(t?b/t:0)},
      onSuccess:()=>res()
    });
    up.start();
  });
}
async function uploadForumFile(f,onProgress){
  if(f.size>MAX_FILE)throw new Error("big");
  let blob=f,type=f.type||"application/octet-stream",name=f.name||"file";
  if(type.indexOf("image/")===0&&type!=="image/gif"&&f.size<=25*1024*1024){
    try{blob=await shrinkImage(f,1400,0.78);type="image/jpeg"}catch(e){blob=f}
  }
  const path=user.id+"/f-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+"-"+safeName(name);
  if(blob.size>TUS_MIN)await uploadBig(blob,name,path,type,onProgress);
  else{
    const up=await sb.storage.from("forum").upload(path,blob,{contentType:type,cacheControl:"31536000"});
    if(up.error)throw up.error;
  }
  const pub=sb.storage.from("forum").getPublicUrl(path);
  if(!pub||!pub.data||!pub.data.publicUrl)throw new Error("url");
  return {name:name,url:pub.data.publicUrl,type:type,size:blob.size||f.size};
}
async function uploadMediaFile(f,item,prefix,refresh){
  if(f.size>MAX_FILE)throw new Error("big");
  let blob=f,type=f.type||"application/octet-stream",name=f.name||"file";
  if(type.indexOf("image/")===0&&type!=="image/gif"&&f.size<=25*1024*1024){
    try{blob=await shrinkImage(f,1600,0.8);type="image/jpeg"}catch(e){blob=f}
  }
  const path=user.id+"/"+(prefix||"m")+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+safeName(name);
  if(blob.size>TUS_MIN){
    await uploadBig(blob,name,path,type,p=>{item.pct=p;if(refresh)refresh()},"media");
  }else{
    const up=await sb.storage.from("media").upload(path,blob,{contentType:type,cacheControl:"31536000"});
    if(up.error)throw up.error;
  }
  const pub=sb.storage.from("media").getPublicUrl(path);
  if(!pub||!pub.data||!pub.data.publicUrl)throw new Error("url");
  return {path:path,name:name,type:type,size:blob.size||f.size,url:pub.data.publicUrl};
}
function renderFiles(box,files,removable){
  box.textContent="";
  files.forEach((f,i)=>{
    const it=document.createElement("div");it.className="fitem glass"+(f.uploading?" up":"");
    if(!f.uploading&&(f.type||"").indexOf("image/")===0&&f.url){
      const im=document.createElement("img");im.src=f.url;im.alt="";it.appendChild(im);
    }else if(!f.uploading&&(f.type||"").toLowerCase().indexOf("video/")===0&&f.url){
      const v=document.createElement("video");v.src=f.url;v.muted=true;v.preload="metadata";v.setAttribute("muted","");v.playsInline=true;it.appendChild(v);
    }
    const nm=document.createElement("span");nm.className="fn2";nm.textContent=f.name||"file";it.appendChild(nm);
    const sz=document.createElement("span");sz.className="mtime";
    sz.textContent=f.uploading?(Math.round((f.pct||0)*100)+"%"):fmtSize(f.size);
    it.appendChild(sz);
    if(removable&&!f.uploading){
      const b=document.createElement("button");b.type="button";b.textContent="✕";
      b.onclick=()=>{files.splice(i,1);renderFiles(box,files,true)};
      it.appendChild(b);
    }
    box.appendChild(it);
  });
}
function fileNode(f){
  if((f.type||"").indexOf("image/")===0){
    const im=document.createElement("img");im.className="fimg";im.src=f.url;im.loading="lazy";im.alt=f.name||"";
    im.onclick=()=>{try{window.open(f.url,"_blank","noopener")}catch(e){}};
    return im;
  }
  const a=document.createElement("a");a.className="fattach glass";a.href=f.url;a.target="_blank";a.rel="noopener noreferrer";
  a.innerHTML='<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
  const sp=document.createElement("span");sp.textContent=(f.name||"file")+(f.size?" · "+fmtSize(f.size):"");
  a.appendChild(sp);
  return a;
}
function msgAttNode(m){
  if(!m||!m.att_path)return null;
  const u=mediaUrl(m.att_path,"media");
  const tp=(m.att_type||"").toLowerCase();
  if(tp.indexOf("video/")===0){
    const wrap=document.createElement("div");
    const v=document.createElement("video");
    v.className="dmvid";v.src=u;v.controls=true;v.playsInline=true;v.preload="metadata";
    v.setAttribute("playsinline","");
    wrap.appendChild(v);
    const a=document.createElement("a");
    a.className="dmvidlink";a.href=u;a.target="_blank";a.rel="noopener noreferrer";
    a.textContent=(m.att_name||t("dm_video"))+(m.att_size?" · "+fmtSize(m.att_size):"");
    wrap.appendChild(a);
    return wrap;
  }
  if(tp.indexOf("image/")===0){
    const im=document.createElement("img");
    im.className="dmimg";im.src=u;im.alt=m.att_name||"";im.loading="lazy";
    im.onclick=()=>{try{window.open(u,"_blank","noopener")}catch(e){}};
    return im;
  }
  return fileNode({name:m.att_name||"file",size:m.att_size,type:m.att_type,url:u});
}
$("t_att").onclick=()=>{if(!user){go("register");return}fileTarget="thread";$("file5").click()};
$("th_att").onclick=()=>{if(!user)return;fileTarget="reply";$("file5").click()};
$("file5").onchange=async e=>{
  const fs=[...e.target.files];e.target.value="";
  if(!fs.length||!user||!sb)return;
  const reply=fileTarget==="reply";
  const arr=reply?forumReplyFiles:forumFiles;
  const box=reply?$("th_files"):$("t_files");
  for(const f of fs){
    if(arr.length>=3){toast(t("f_files_max"));break}
    if(f.size>MAX_FILE){toast(t("f_file_big"));continue}
    const item={name:f.name||"file",size:f.size,type:f.type||"",url:"",uploading:true,pct:0};
    arr.push(item);
    renderFiles(box,arr,true);
    toast(t("f_uploading"));
    let last=0;
    try{
      const done=await uploadForumFile(f,p=>{
        const now=Date.now();
        if(now-last<250&&p<1)return;
        last=now;item.pct=p;renderFiles(box,arr,true);
      });
      Object.assign(item,done);item.uploading=false;
    }catch(err){
      const k=arr.indexOf(item);if(k>=0)arr.splice(k,1);
      toast(t(tooLargeErr(err)?"f_plan_limit":(err&&err.message==="big"?"f_file_big":"f_upload_fail")));
    }
    renderFiles(box,arr,true);
  }
};

/* ---------- друзья ---------- */
let frState={friends:[],req:[]};
async function loadFriends(){
  const box=$("pfriends");
  if(!box)return;
  if(!user||!sb){box.textContent="";box.style.display="none";return}
  try{
    const [a,b]=await Promise.all([sb.rpc("friends_list"),sb.rpc("friend_requests")]);
    frState.friends=(a&&!a.error&&a.data)||[];
    frState.req=(b&&!b.error&&b.data)||[];
    renderFriends();
  }catch(e){}
}
function renderFriends(){
  const box=$("pfriends");
  if(!box)return;
  box.textContent="";
  if(!frState.friends.length&&!frState.req.length){box.style.display="none";return}
  box.style.display="";
  if(frState.req.length){
    const h=document.createElement("div");h.className="frhead";h.textContent=t("fr_req_title");
    box.appendChild(h);
    frState.req.forEach(r=>{
      const row=document.createElement("div");row.className="frrow glass";
      const av=document.createElement("div");av.className="ava";setAva(av,r.avatar,false);setRoleClass(av,r.role||"user");row.appendChild(av);
      const nm=document.createElement("span");nm.className="frnick";richName(nm,r.id,r.nick);row.appendChild(nm);
      const bs=document.createElement("div");bs.className="frbtns";
      const ok=document.createElement("button");ok.type="button";ok.textContent="✓";ok.title=t("fr_accept");
      ok.onclick=()=>answerFriend(r.id,true);
      const no=document.createElement("button");no.type="button";no.textContent="✕";no.title=t("fr_decline");
      no.onclick=()=>answerFriend(r.id,false);
      bs.appendChild(ok);bs.appendChild(no);row.appendChild(bs);
      box.appendChild(row);
    });
  }
  if(frState.friends.length){
    const h=document.createElement("div");h.className="frhead";h.textContent=t("fr_list")+" · "+frState.friends.length;
    box.appendChild(h);
    const chips=document.createElement("div");chips.className="fchips";
    frState.friends.forEach(f=>{
      const c=document.createElement("button");c.type="button";c.className="fchip";
      const av=document.createElement("div");av.className="ava";setAva(av,f.avatar,false);setRoleClass(av,f.role||"user");
      const sp=document.createElement("span");richName(sp,f.id,f.nick);
      c.appendChild(av);c.appendChild(sp);
      c.onclick=()=>openProfile(f.id);
      chips.appendChild(c);
    });
    box.appendChild(chips);
  }
}

async function initFriendBtn(p){
  const b=$("u_friend");
  if(!b)return;
  if(!user||!sb||!p.id||p.id===user.id){b.style.display="none";return}
  b.style.display="";
  b.disabled=true;b.classList.remove("main");b.textContent=t("fr_add");
  let st="none";
  try{
    const r=await sb.rpc("friend_status",{p_target:p.id});
    if(!r.error&&r.data)st=r.data;
  }catch(e){}
  b.disabled=false;
  if(st==="friends"){
    b.textContent=t("fr_friends");
    b.onclick=()=>askConfirm(t("fr_remove_q"),async()=>{
      try{
        const r=await sb.rpc("friend_remove",{p_target:p.id});
        if(r.error)throw r.error;
        toast(t("fr_removed"));
        await initFriendBtn(p);
        await loadFriends();
      }catch(e){toast(t("err_generic"))}
    });
  }else if(st==="out"){
    b.textContent=t("fr_out");b.onclick=null;b.disabled=true;
  }else if(st==="in"){
    b.textContent=t("fr_in");b.classList.add("main");
    b.onclick=async()=>{
      try{
        const rr=await sb.rpc("friend_requests");
        const row=((rr&&rr.data)||[]).find(x=>x.user_id===p.id);
        if(!row){toast(t("err_generic"));return}
        const r=await sb.rpc("friend_answer",{p_id:row.id,p_accept:true});
        if(r.error)throw r.error;
        toast(t("fr_added"));
        await initFriendBtn(p);
        await loadFriends();
      }catch(e){toast(t("err_generic"))}
    };
  }else{
    b.textContent=t("fr_add");b.classList.add("main");
    b.onclick=async()=>{
      try{
        const r=await sb.rpc("friend_request",{p_target:p.id});
        if(r.error)throw r.error;
        toast(t("fr_sent"));
        await initFriendBtn(p);
      }catch(e){toast(t("err_generic"))}
    };
  }
}

}
async function groupLoadMsgs(full){
  if(!groupWith||!sb)return;
  const gid=groupWith.id;
  groupBusy=true;
  try{
    const r=await sb.rpc("group_messages",{p_group:gid,p_after:full?0:groupLastId,p_limit:100});
    if(r.error)throw r.error;
    if(!groupWith||groupWith.id!==gid)return;
    const rows=r.data||[];
    if(!groupLastId)groupRows=rows.slice();
    else if(full){
      rows.forEach(m=>{
        const i=groupRows.findIndex(x=>String(x.id)===String(m.id));
        if(i>=0)groupRows[i]=m;else groupRows.push(m);
      });
      groupRows.sort((a,b)=>Number(a.id)-Number(b.id));
    }else rows.forEach(m=>{if(!groupRows.some(x=>String(x.id)===String(m.id)))groupRows.push(m)});
    if(groupRows.length)groupLastId=Math.max(...groupRows.map(m=>Number(m.id)));
    renderGroupMsgs();
  }catch(e){}
  finally{groupBusy=false}
}
function renderGroupMsgs(){
  const box=$("groupmsgs");if(!box)return;
  box.textContent="";
  if(!groupRows.length){
    const p=document.createElement("p");p.className="mail";p.textContent=t("group_empty_msgs");box.appendChild(p);return;
  }
  groupRows.forEach(m=>{
    const mine=m.author===user.id;
    const d=document.createElement("div");d.className="msg"+(mine?" mine":"");
    d.dataset.id=String(m.id);d.dataset.kind="group";
    const head=document.createElement("div");head.className="mh";
    const nk=document.createElement("button");nk.type="button";nk.className="mn mnik";richName(nk,m.user_id||m.author,m.nick);
    nk.onclick=()=>{if(m.author)openProfile(m.author)};
    head.appendChild(nk);
    if(m.author===groupWith.owner){const tg=document.createElement("span");tg.className="mtag";tg.textContent=t("group_owner");head.appendChild(tg)}
    else if(m.role&&m.role!=="user"){const tg=document.createElement("span");tg.className="mtag";tg.textContent=roleLabel(m.role);head.appendChild(tg)}
    const tm=document.createElement("span");tm.className="mtime";
    tm.textContent=new Date(m.created_at).toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"});
    head.appendChild(tm);
    const et=editedTag(m.edited_at);if(et)head.appendChild(et);
    if(!m.deleted&&user&&m.author===user.id){
      const eb=document.createElement("button");eb.type="button";eb.className="mact";eb.textContent="✎";eb.title=t("edit");
      eb.onclick=()=>openMsgEdit("group",m.id,m.body);
      head.appendChild(eb);
    }
    if(!m.deleted&&user&&(m.author===user.id||groupWith.owner===user.id||myRank()>=2)){
      const db=document.createElement("button");db.type="button";db.className="mact";db.textContent="✕";
      db.onclick=()=>askConfirm(t("msg_del_q"),()=>groupDelete(m.id));
      head.appendChild(db);
    }
    d.appendChild(head);
    const att=msgAttNode(m);if(att)d.appendChild(att);
    if(m.deleted||m.body){
      const body=document.createElement("div");body.className="mb rich"+(m.deleted?" del":"");
      if(m.deleted)body.textContent=t("msg_deleted");else setRich(body,m.body);
      d.appendChild(body);
    }
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
async function groupRead(){
  if(!groupWith||!sb||cur!=="dm"||dmTab!=="groups")return;
  const gid=groupWith.id;
  try{await sb.rpc("group_read",{p_group:gid})}catch(e){}

  renderGroupList();

}
function groupPendingRender(){
  const box=$("group_files");if(box)renderFiles(box,groupPending,true);
}
async function groupSend(){
  if(!groupWith||!user||!sb)return;
  if(groupPending.some(x=>x.uploading)){toast(t("media_wait_upload"));return}
  const inp=$("groupin");
  const txt=inp.value.trim();
  const atts=groupPending.filter(x=>x.path);
  if(!txt&&!atts.length)return;
  const gid=groupWith.id;
  const payloads=atts.length?atts.map((f,i)=>({
    p_group:gid,p_body:i===0?txt:"",
    p_att_path:f.path,p_att_name:f.name,p_att_type:f.type,p_att_size:Math.round(f.size||0)
  })):[{p_group:gid,p_body:txt,p_att_path:null,p_att_name:null,p_att_type:null,p_att_size:null}];
  inp.value="";resizeEditor(inp);
  groupPending=[];groupPendingRender();
  const btn=$("groupsendbtn");btn.disabled=true;
  let sent=0;
  try{
    for(const args of payloads){
      const r=await sb.rpc("group_send",args);
      if(r.error)throw r.error;
      sent++;
    }
    await groupLoadMsgs();
    groupRead();
  }catch(e){
    const msg=((e&&e.message)||"").toLowerCase();
    toast(t(msg.indexOf("slow")>-1?"group_slow":msg.indexOf("big")>-1?"f_file_big":"err_generic"));
    if(sent===0){inp.value=txt;resizeEditor(inp);groupPending=atts;groupPendingRender()}
    await groupLoadMsgs();
  }finally{btn.disabled=false}
}
async function groupDelete(id){
  try{
    const r=await sb.rpc("group_message_delete",{p_id:id});
    if(r.error)throw r.error;
    const m=groupRows.find(x=>String(x.id)===String(id));
    if(m){m.deleted=true;m.body="";m.att_path=null}
    renderGroupMsgs();
  }catch(e){toast(t("err_generic"))}
}
function startGroupPoll(){

    if(cur!=="dm"||dmTab!=="groups"||document.hidden||!groupWith)return;
    groupTick++;
    groupLoadMsgs(groupTick%10===0).then(()=>{if(groupWith)groupRead()});
  },2500);
}

async function dmLoadMsgs(full){
  if(!dmWith||!sb)return;
  const withId=dmWith.id;
  try{
    const r=await sb.rpc("dm_list",{p_with:withId,p_after:full?0:dmLastId});
    if(r.error)throw r.error;
    if(!dmWith||dmWith.id!==withId)return;
    const rows=r.data||[];
    if(!dmLastId){
      dmRows=rows.slice().sort((a,b)=>Number(a.id)-Number(b.id));
    }else if(full){
      rows.forEach(m=>{
        const i=dmRows.findIndex(x=>String(x.id)===String(m.id));
        if(i>=0)dmRows[i]=m;else dmRows.push(m);
      });
      dmRows.sort((a,b)=>Number(a.id)-Number(b.id));
    }else{
      rows.forEach(m=>{if(!dmRows.some(x=>String(x.id)===String(m.id)))dmRows.push(m)});
    }
    if(dmRows.length)dmLastId=Math.max(...dmRows.map(m=>Number(m.id)));

  }catch(e){}

async function dmUploadFile(f,item){
  if(f.size>MAX_FILE)throw new Error("big");
  let blob=f,type=f.type||"application/octet-stream",name=f.name||"file";
  if(type.indexOf("image/")===0&&type!=="image/gif"&&f.size<=25*1024*1024){
    try{blob=await shrinkImage(f,1400,0.78);type="image/jpeg"}catch(e){blob=f}
  }
  const path=user.id+"/d-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"-"+safeName(name);
  if(blob.size>TUS_MIN)await uploadBig(blob,name,path,type,p=>{item.pct=p;dmPendingRender()},"dm");
  else{
    const up=await sb.storage.from("dm").upload(path,blob,{contentType:type,cacheControl:"31536000"});
    if(up.error)throw up.error;
  }
  const pub=sb.storage.from("dm").getPublicUrl(path);
  if(!pub||!pub.data||!pub.data.publicUrl)throw new Error("url");
  return {path,name,type,size:blob.size||f.size,url:pub.data.publicUrl};
}

async function dmSend(){

  const inp=$("dmin");const txt=inp.value.trim();

  const withId=dmWith.id;
  const payloads=atts.map((f,i)=>({p_to:withId,p_body:i===0?txt:"",p_att_path:f.path,p_att_name:f.name,p_att_type:f.type,p_att_size:Math.round(f.size||0)}));
  if(!payloads.length)payloads.push({p_to:withId,p_body:txt});
  inp.value="";dmPending=[];dmPendingRender();
  const btn=$("dmsendbtn");btn.disabled=true;
  let sent=0;
  try{
    for(const args of payloads){
      const r=await sb.rpc("dm_send",args);
      if(r.error)throw r.error;
      sent++;
    }
    await dmLoadMsgs();
    dmRead();

/* ---------- журнал действий ---------- */
let auditRows=[],auditBusy=false;
function auditLabel(a){
  const k="a_"+a,v=t(k);
  return v&&v!==k?v:a;
}
function auditFieldLabel(k){
  const map={old_role:"audit_old",new_role:"audit_new",role:"audit_role",reason:"audit_reason",
    expires_at:"audit_until",channel:"audit_channel",group:"audit_group",server:"audit_server",
    code:"srv_invite_code",description:"srv_desc_ph",name:"audit_target",nick:"audit_user"};
  return map[k]?t(map[k]):k;
}
function auditDetails(d){
  if(!d||typeof d!=="object")return "";
  const skip=/^(user_id|group_id|server_id|channel_id|message_id|thread_id|reply_id|warning_id|author|owner)$/;
  const parts=[];
  Object.keys(d).forEach(k=>{
    if(skip.test(k))return;
    let v=d[k];
    if(v==null||v==="")return;
    if(typeof v==="object")v=JSON.stringify(v);
    else if(k==="old_role"||k==="new_role")v=roleLabel(v);
    else if(k==="role")v=(v==="owner"||v==="admin"||v==="member")?srvRoleLabel(v):roleLabel(v);
    parts.push(auditFieldLabel(k)+": "+v);
  });
  return parts.join(" · ");
}
function renderAudit(){
  const box=$("alist");if(!box)return;
  box.textContent="";
  if(!auditRows.length){
    const p=document.createElement("p");p.className="mail";p.textContent=t("audit_empty");box.appendChild(p);return;
  }
  auditRows.forEach(a=>{
    const it=document.createElement("div");it.className="aitem";
    const top=document.createElement("div");top.className="atop";
    const act=document.createElement("span");act.className="aact";act.textContent=auditLabel(a.action);
    top.appendChild(act);
    const who=document.createElement("span");who.className="awho";
    who.textContent=a.actor?((a.actor_nick||"?")+" · "+roleLabel(a.actor_role||"user")):t("audit_system");
    top.appendChild(who);
    const tm=document.createElement("span");tm.className="atime";
    tm.textContent=new Date(a.created_at).toLocaleString(locale(),{dateStyle:"short",timeStyle:"short"});
    top.appendChild(tm);
    it.appendChild(top);
    const bits=[];
    if(a.target)bits.push(a.target);
    const det=auditDetails(a.details);
    if(det)bits.push(det);
    if(bits.length){
      const dd=document.createElement("div");dd.className="adet";dd.textContent=bits.join(" · ");
      it.appendChild(dd);
    }
    box.appendChild(it);
  });
}
async function loadAudit(){
  if(!user||!sb||myRank()<3){toast(t("err_generic"));return}
  if(auditBusy)return;
  auditBusy=true;
  const box=$("alist");
  if(box)box.textContent=t("audit_loading");
  try{
    const r=await sb.rpc("audit_list",{p_limit:200,p_offset:0});
    if(r.error)throw r.error;
    auditRows=r.data||[];
    renderAudit();
  }catch(e){
    auditRows=[];
    if(box)box.textContent=t("err_generic");
  }finally{auditBusy=false}
}

/* ---------- админ-панель ---------- */
async function loadUsers(){
  $("ulist").textContent="";
  $("utotal").textContent=t("loading");
  try{
    const res=await Promise.all([sb.rpc("admin_users"),sb.rpc("admin_bans"),sb.rpc("warnings_counts")]);
    if(res[0].error)throw res[0].error;
    if(res[1].error)throw res[1].error;
    allUsers=res[0].data||[];
    bansByUser={};
    (res[1].data||[]).forEach(b=>{bansByUser[b.user_id]=b});
    warnByUser={};
    if(res[2]&&!res[2].error)(res[2].data||[]).forEach(w=>{warnByUser[w.user_id]=Number(w.cnt)});
    renderUsers();
  }catch(e){$("utotal").textContent=t("err_generic")}
}
function assignableRoles(){
  let list=ROLES.filter(r=>rk(r)<myRank());
  if(myRank()>=5&&allUsers.some(x=>x.role==="coowner"))list=list.filter(r=>r!=="coowner");
  return list;
}
function renderUsers(){
  const q=$("usearch").value.trim().toLowerCase();
  const list=$("ulist");list.textContent="";
  const rows=allUsers.filter(u=>!q||String(u.short_id).indexOf(q)>-1||u.nick.toLowerCase().indexOf(q)>-1||(u.email||"").toLowerCase().indexOf(q)>-1);
  $("utotal").textContent=t("total").replace("{n}",allUsers.length);
  if(!rows.length){const p=document.createElement("p");p.textContent=t("no_users");list.appendChild(p);return}
  const mr=myRank();
  rows.forEach(u=>{
    const card=document.createElement("div");card.className="ucard glass";
    const top=document.createElement("div");top.className="urow";
    const name=document.createElement("button");name.type="button";name.className="uopen";richName(name,u.id,"#"+u.short_id+" "+u.nick);
    name.onclick=()=>openProfile(u.id);
    const bd=document.createElement("span");bd.className="badge "+u.role;bd.textContent=roleLabel(u.role);
    top.appendChild(name);top.appendChild(bd);
    const mail=document.createElement("div");mail.className="mail";mail.textContent=u.email;
    const date=document.createElement("div");date.className="mail";date.textContent=new Date(u.created_at).toLocaleDateString(locale());
    card.appendChild(top);card.appendChild(mail);card.appendChild(date);
    const b=bansByUser[u.id];
    if(b){
      const bi=document.createElement("div");bi.className="baninfo";
      bi.textContent=t("banned")+" · "+fmtUntil(b)+(b.reason?" · "+b.reason:"")+" · IP: "+b.ips+" · "+t("devices")+": "+b.devices;
      card.appendChild(bi);
    }
    const acts=document.createElement("div");acts.className="uacts";
    const lower=user&&u.id!==user.id&&rk(u.role)<mr;
    const wc=warnByUser[u.id]||0;
    if(wc){
      const wb=document.createElement("button");wb.className="mini warn";wb.textContent="⚠ "+wc;
      wb.onclick=()=>openWarnList(u);acts.appendChild(wb);
    }
    if(mr>=2&&lower){
      const wb2=document.createElement("button");wb2.className="mini warn";wb2.textContent="⚠ "+t("w_warn");
      wb2.onclick=()=>openWarn(u);acts.appendChild(wb2);
      if(mr>=3){
        const rb=document.createElement("button");rb.className="mini";
        rb.textContent=roleLabel(u.role)+" ▾";
        rb.onclick=()=>openSheet(t("pick_role"),assignableRoles().map(r=>({v:r,label:roleLabel(r)})),u.role,v=>{if(v!==u.role)setRole(u.id,v)});
        acts.appendChild(rb);
      }
      if(b){
        const eb=document.createElement("button");eb.className="mini";eb.textContent=t("ban_edit_btn");
        eb.onclick=()=>openBan("edit",u,b);acts.appendChild(eb);
        const ub=document.createElement("button");ub.className="mini";ub.textContent=t("unban_btn");
        ub.onclick=()=>askConfirm(t("unban_q").replace("{n}",u.nick),()=>unban(b.grp));acts.appendChild(ub);
      }else{
        const bb=document.createElement("button");bb.className="mini danger";bb.textContent=t("ban_btn");
        bb.onclick=()=>openBan("new",u,null);acts.appendChild(bb);
      }
    }
    if(mr>=3&&lower){
      const db=document.createElement("button");db.className="mini danger";db.textContent=t("delete_user");
      db.onclick=()=>askConfirm(t("delete_q").replace("{n}",u.nick),()=>delUser(u.id));acts.appendChild(db);
    }
    if(mr>=4&&lower){
      const ab=document.createElement("button");ab.className="mini";ab.textContent=t("p_set_ava");
      ab.onclick=()=>pickAva(u.id);acts.appendChild(ab);
    }
    if(acts.children.length)card.appendChild(acts);
    list.appendChild(card);
  });
}
$("usearch").oninput=renderUsers;
async function rpcDone(name,args){
  try{
    const r=await sb.rpc(name,args);
    if(r.error)throw r.error;
    toast(t("saved"));loadUsers();
  }catch(e){
    const msg=((e&&e.message)||"").toLowerCase();
    toast(t(msg.indexOf("coowner")>-1?"err_coowner_exists":"err_generic"));
    loadUsers();
  }
}
const setRole=(id,role)=>rpcDone("admin_set_role",{target:id,new_role:role});
const delUser=id=>rpcDone("admin_delete_user",{target:id});
const unban=grp=>rpcDone("admin_unban",{p_grp:grp});

function openBan(m,u,b){
  banCtx={mode:m,u:u,b:b};
  $("btitle").textContent=t(m==="new"?"ban_title":"ban_edit_title").replace("{n}",u.nick);
  if(m==="edit"){
    if(!b.expires_at){setBanDur("perm");$("bcustom").value=""}
    else{setBanDur("custom");$("bcustom").value=Math.max(1,Math.ceil((new Date(b.expires_at).getTime()-Date.now())/60000))}
    $("breason").value=b.reason||"";
  }else{
    setBanDur("1440");$("bcustom").value="";$("breason").value="";
    $("bip").checked=false;$("bdev").checked=false;
  }
  const show=m==="new"?"":"none";
  $("bipw").style.display=show;$("bdevw").style.display=show;
  $("bmodal").classList.add("show");
}
$("byes").onclick=async()=>{
  if(!banCtx)return;
  let mins=null;
  if(banDur==="custom"){
    mins=parseInt($("bcustom").value,10);
    if(!(mins>0)){toast(t("ban_bad_dur"));return}
  }else if(banDur!=="perm"){mins=parseInt(banDur,10)}
  const reason=$("breason").value.trim()||null;
  const ctx=banCtx;
  $("bmodal").classList.remove("show");banCtx=null;
  if(ctx.mode==="new")rpcDone("admin_ban",{p_target:ctx.u.id,p_minutes:mins,p_reason:reason,p_ip:$("bip").checked,p_device:$("bdev").checked});
  else rpcDone("admin_edit_ban",{p_grp:ctx.b.grp,p_minutes:mins,p_reason:reason});
};
$("bno").onclick=()=>{$("bmodal").classList.remove("show");banCtx=null};
$("bmodal").onclick=e=>{if(e.target===$("bmodal"))$("bno").onclick()};

/* ---------- шторка (как в iOS/MIUI): свайп вниз от верхнего края ---------- */
function updateShade(){
  const u=user;
  setAva($("sh_ava"),u&&u.avatar,u&&ownerLike(u.role));
  setRoleClass($("sh_ava"),u?u.role:"user");
  if(u)richName($("sh_nick"),u.id,u.nick);else $("sh_nick").textContent=t("s_guest");
  $("sh_role").textContent=u?roleLabel(u.role):"";
  $("t_lang_l").textContent=t("s_lang")+": "+lang.toUpperCase();
  const w=WALLS.find(x=>x[0]===wallId);
  $("t_wall_l").textContent=t("s_wall")+": "+t(w?w[1]:"w_none");
  $("t_out_l").textContent=t(u?"s_out":"s_in");
  $("t_admin").style.display=isStaff()?"":"none";
}
function openShade(){updateShade();$("shade").classList.add("open")}
function closeShade(){$("shade").classList.remove("open")}
$("grab").onclick=()=>{$("shade").classList.contains("open")?closeShade():openShade()};

function nextWall(){
  const ok=WALLS.filter(w=>(w[2]||myRank()>=1)&&(w[0]!=="custom"||(user&&user.wallCustom))).map(w=>w[0]);
  const i=ok.indexOf(wallId);
  const id=ok[(i+1)%ok.length];
  setWall(id);
  if(user&&sb)Promise.resolve(sb.from("profiles").update({wallpaper:id}).eq("id",user.id)).catch(function(){});
  updateShade();
}
$("t_lang").onclick=()=>{setLang(lang==="ru"?"en":"ru");setTimeout(updateShade,300)};
$("t_wall").onclick=nextWall;

let shDrag=null;
function shadeH(){return $("shadecard").offsetHeight}
document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){shDrag=null;return}
  const y=e.touches[0].clientY;
  const open=$("shade").classList.contains("open");
  if(open)shDrag={sy:y,open:true,moved:false};
  else if(y<26)shDrag={sy:y,open:false,moved:false};
  else shDrag=null;
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!shDrag)return;
  const dy=e.touches[0].clientY-shDrag.sy;
  if(!shDrag.moved&&Math.abs(dy)<8)return;
  if(!shDrag.moved&&((shDrag.open&&dy>0)||(!shDrag.open&&dy<0))){shDrag=null;return}
  shDrag.moved=true;
  e.preventDefault();
  const h=shadeH();
  const y=shDrag.open?Math.max(-h,Math.min(0,dy)):Math.max(-h,Math.min(0,-h+dy));
  const c=$("shadecard");
  c.style.transition="none";
  c.style.transform="translateY("+y+"px)";
  $("sbg").style.transition="none";
  $("sbg").style.opacity=String(Math.max(0,Math.min(1,1+y/h)));
  $("shade").style.pointerEvents="auto";
},{passive:false});
function endDrag(e){
  if(!shDrag)return;
  const d=shDrag;shDrag=null;
  const c=$("shadecard");
  c.style.transition="";c.style.transform="";
  $("sbg").style.transition="";$("sbg").style.opacity="";
  $("shade").style.pointerEvents="";
  if(!d.moved)return;
  const h=shadeH();
  const ty=(e&&e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientY-d.sy:0;
  if(d.open){if(ty<-h*0.25)closeShade();else openShade()}
  else{if(ty>h*0.3)openShade();else closeShade()}
}
document.addEventListener("touchend",endDrag);
document.addEventListener("touchcancel",endDrag);

/* ---------- капча и запуск ---------- */
function renderCaptcha(){
  if(cfId!==null||!window.turnstile)return;
  cfId=turnstile.render("#cf",{sitekey:TURNSTILE_SITE_KEY,theme:"dark",callback:function(tk){cfToken=tk},"expired-callback":function(){cfToken=null},"error-callback":function(){cfToken=null}});
}
function resetCaptcha(){
  cfToken=null;
  try{if(cfId!==null)turnstile.reset(cfId)}catch(e){}
}
window.addEventListener("load",renderCaptcha);
async function boot(){
  try{
    if(sb){
      let r=null;
      for(let i=0;i<2;i++){
        try{r=await sb.auth.getSession();break}
        catch(e){if(i===0)await wait(700)}
      }
      if(r&&r.data&&r.data.session)await loadUser(r.data.session.user);
    }
  }catch(e){}
  renderUser();
  if(user)await afterAuth();else await checkBan();
}
buildAI();
setPrev(null);
renderUser();
applyLang();
const w0=load("wall");
if(w0&&WALLS.some(x=>x[0]===w0))setWall(w0);
if(sb){
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==="SIGNED_OUT"){
      const had=!!user;
      user=null;chatRooms=[];chatRoom=null;chatSig="";
      stopChat();chatReset();stopNotif();dmReset();
      notif=[];renderNotifBadge();
      frState={friends:[],req:[]};
      const pf=$("pfriends");if(pf)pf.textContent="";
      if(had){renderUser();if(cur!=="register")go("home")}
    }else if((ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED")&&s&&!user){
      loadUser(s.user).then(()=>{renderUser();if(cur==="chat")chatInit();else if(cur==="dm")dmInit()}).catch(()=>{});
    }
  });
}
boot();
