<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>fsociety</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% 30%,#161616,#000 70%);color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif;text-align:center}
.user{--c:#4ade80}.sponsor{--c:#facc15}.moderator{--c:#38bdf8}.admin{--c:#f59e0b}.owner{--c:#ef4444}
#wall{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glass{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.45)}
#back,#langbtn{position:fixed;top:calc(10px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;color:#f5f5f5;cursor:pointer;z-index:6;font-size:.78rem;font-weight:bold}
#back{left:12px;opacity:0;pointer-events:none;transform:rotate(-360deg) scale(.3);transition:transform .6s ease,opacity .4s ease}
#back.show{opacity:1;pointer-events:auto;transform:none}
#back svg{width:20px;height:20px}
#langbtn{right:12px}
#grab{position:fixed;top:0;left:50%;transform:translateX(-50%);width:96px;height:22px;z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:6px;box-sizing:border-box;cursor:pointer}
#grab::after{content:"";width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
#dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translate(-50%,170%);display:flex;width:min(92vw,440px);padding:6px;border-radius:26px;z-index:6;transition:transform .8s cubic-bezier(.2,.9,.2,1)}
body.ready #dock{transform:translate(-50%,0)}
#dock button{all:unset;position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:20px;cursor:pointer;color:#bdbdbd;font-size:.68rem;transition:color .3s,transform .2s}
#dock button:active{transform:scale(.9)}
#dock button.on{color:#fff}
#dock button>svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:20px;background:rgba(255,255,255,.18);transition:transform .35s cubic-bezier(.3,1.3,.5,1),width .3s;z-index:0}
.dav,.ava{border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#f5f5f5;box-sizing:border-box}
.dav{width:24px;height:24px;border:2px solid var(--c)}
.dav svg,.ava svg{width:68%;height:68%}
.dav img,.ava img{width:100%;height:100%;object-fit:cover;display:block}
.dav img.spin,.ava img.spin{object-fit:contain;background:#000;animation:rot 8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{from{box-shadow:0 0 6px 1px var(--c)}to{box-shadow:0 0 20px 5px var(--c)}}
.dav.owner,.dav.admin,.dav.moderator,.dav.sponsor{animation:pulse 2s ease-in-out infinite alternate}
#app{opacity:0;transition:opacity .8s ease;position:relative;z-index:1}
body.ready #app{opacity:1}
.view{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;padding:calc(60px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));box-sizing:border-box;opacity:0;transform:translateY(20px) scale(.98);pointer-events:none;transition:opacity .45s ease,transform .45s ease}
.view.active{opacity:1;transform:none;pointer-events:auto}
.box{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:340px}
.authform{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#home .box{margin:0 auto;max-width:420px}
#admin .box,#forum .box{max-width:440px}
#chat .box{margin:0 auto;max-width:460px;flex:1;min-height:0;align-items:stretch}
.banner{width:100%;border-radius:18px;display:block;box-shadow:0 0 22px 3px rgba(255,255,255,.3)}
.tag{padding:8px 16px;border-radius:999px;font-size:.85rem;letter-spacing:.06em}
h2{color:#fff;margin:0;font-size:1.5rem}
p{margin:0}
.regonly{display:contents}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;box-sizing:border-box;padding:10px 16px;border-radius:999px;font-size:16px;color:#fff;outline:none}
textarea{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:18px;font-size:15px;color:#fff;outline:none;resize:none;font-family:inherit;height:70px}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.5)}
.btn{border:none;border-radius:999px;padding:9px 20px;font-size:.95rem;cursor:pointer;color:#f5f5f5}
.btn.main{background:#fff;color:#000;font-weight:bold}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn:disabled{opacity:.6}
.pick{width:100%}
.link{all:unset;cursor:pointer;color:#e5e5e5;opacity:.75;font-size:.9rem;text-decoration:underline;padding:4px}
.err{color:#fca5a5;min-height:1.1em;font-size:.85rem}
#cf{display:flex;justify-content:center;min-height:0}
#prev{width:84px;height:84px;border:2px solid #4ade80}
#pava{width:104px;height:104px;border:3px solid var(--c);box-shadow:0 0 16px 2px var(--c)}
#pava.owner,#pava.admin,#pava.moderator,#pava.sponsor{animation:pulse 2s ease-in-out infinite alternate}
.prow{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
#pnick{font-size:1.5rem;color:#fff;font-weight:bold;word-break:break-word}
.pen{width:30px;height:30px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;color:#fff;transition:transform .2s}
.pen:active{transform:rotate(-25deg) scale(.88)}
.mail{opacity:.6;font-size:.85rem;word-break:break-all}
.bio{font-size:.9rem;opacity:.85;line-height:1.4;max-width:300px;word-break:break-word}
.badge{border:1px solid var(--c);color:var(--c);background:rgba(255,255,255,.07);font-weight:bold;letter-spacing:2px;font-size:.72rem;padding:3px 12px;border-radius:999px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;width:100%;box-sizing:border-box}
.seg button{all:unset;flex:1;text-align:center;padding:8px 0;border-radius:999px;cursor:pointer;font-size:.9rem;color:#ccc;transition:background .3s,color .3s}
.seg button.on{background:rgba(255,255,255,.22);color:#fff;font-weight:bold}
.pane{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.ailist{display:flex;flex-direction:column;gap:8px;width:100%}
.ailink{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;text-decoration:none;color:#fff;text-align:left;transition:transform .15s,background .3s}
.ailink:active{transform:scale(.97)}
.ailink span:first-child{font-weight:bold}
.ailink small{opacity:.55;font-size:.75rem;margin-left:auto;margin-right:6px}
.ailink .ar{opacity:.7}
.rooms{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:4px;flex:none}
.room{border:none;border-radius:999px;padding:7px 14px;font-size:.82rem;cursor:pointer;color:#ddd;background:rgba(255,255,255,.1);white-space:nowrap;flex:none}
.room.on{background:#fff;color:#000;font-weight:bold}
.msgs{flex:1;min-height:0;overflow-y:auto;width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;padding:4px 0}
.msg{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:7px 10px;max-width:92%;align-self:flex-start;box-sizing:border-box}
.msg.mine{align-self:flex-end;background:rgba(255,255,255,.14)}
.mh{display:flex;align-items:center;gap:6px;font-size:.75rem}
.mn{color:var(--c)}
.mtag{border:1px solid var(--c);color:var(--c);font-size:.58rem;padding:0 6px;border-radius:999px;letter-spacing:1px}
.mtime{opacity:.5}
.mdel{all:unset;cursor:pointer;opacity:.5;margin-left:auto;padding:0 4px}
.mb{font-size:.92rem;word-break:break-word;white-space:pre-wrap;margin-top:2px}
.mb.del{opacity:.4;font-style:italic}
.sendrow{display:flex;gap:8px;width:100%;flex:none;align-items:center}
.chatlogin{margin:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.ulist{display:flex;flex-direction:column;gap:8px;width:100%}
.ucard{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.urow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.urow b{word-break:break-word}
.uopen{all:unset;cursor:pointer;font-weight:bold;text-align:left;word-break:break-word}
.mini.warn{background:rgba(245,158,11,.22);border-color:rgba(245,158,11,.5)}
#pwarn{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;font-size:.84rem;margin-top:4px}
#pwarn .wt{color:#f59e0b;font-weight:bold}
#pwarn .we{opacity:.85;font-size:.8rem}
.witem{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:9px 11px;border-radius:14px;font-size:.85rem}
.witem .wr{flex:1;word-break:break-word}
.witem .wmeta{display:block;font-size:.72rem;opacity:.55;margin-top:2px}
.fprev{display:flex;flex-direction:column;gap:6px;width:100%}
.fprev:empty{display:none}
.fitem{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:12px;font-size:.78rem}
.fitem.up{opacity:.75}
.fitem.up .mtime{color:#7ee0a1;font-weight:600}
.fitem img{width:40px;height:40px;object-fit:cover;border-radius:8px;flex:none}
.fitem .fn2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.fitem button{all:unset;cursor:pointer;opacity:.6;padding:0 4px}
.fattach{display:flex;gap:8px;align-items:center;margin-top:6px;padding:8px 10px;border-radius:12px;font-size:.82rem;text-decoration:none;color:inherit;width:100%;box-sizing:border-box}
.fattach svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fattach span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fimg{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-top:6px}
.row2{display:flex;gap:8px;align-items:center;width:100%}
.row2 .btn{flex:1}
#th_att{flex:none;padding:9px 11px;display:flex;align-items:center;justify-content:center}
#th_att svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pfriends{width:100%;display:flex;flex-direction:column;gap:8px}
.frhead{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.55;text-align:left;margin-top:2px}
.frrow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:14px;width:100%;box-sizing:border-box}
.frrow .ava,.fchip .ava{width:38px;height:38px;flex:none;border:2px solid var(--c,#888)}
.frnick{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-size:.85rem}
.frbtns{display:flex;gap:6px;flex:none}
.frbtns button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09);font-size:.95rem}
.frbtns button:active{transform:scale(.92)}
.fchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.fchip{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px}
.fchip:active{transform:scale(.95)}
.fchip span{font-size:.68rem;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.mini{border:none;border-radius:999px;padding:7px 12px;font-size:.8rem;cursor:pointer;color:#f5f5f5;background:rgba(255,255,255,.14)}
.mini.danger{background:rgba(239,68,68,.35);color:#fecaca}
.baninfo{color:#fca5a5;font-size:.8rem;word-break:break-word}
#modal,#bmodal,#pmodal,#emodal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;overflow-y:auto;padding:16px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .25s ease}
#modal.show,#bmodal.show,#pmodal.show,#emodal.show{opacity:1;pointer-events:auto}
.mcard{margin:auto;width:100%;max-width:320px;box-sizing:border-box;padding:18px;border-radius:22px;display:flex;flex-direction:column;gap:10px;background:#141414;border:1px solid rgba(255,255,255,.2)}
.mt{font-weight:bold;font-size:1.05rem;word-break:break-word}
.erow{display:flex;align-items:center;gap:12px;justify-content:center}
#eava{width:64px;height:64px;border:2px solid rgba(255,255,255,.35)}
.lab{align-self:flex-start;font-size:.85rem;opacity:.85}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.wopt{border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 2px;font-size:.72rem;cursor:pointer;background:rgba(255,255,255,.06);color:#eee}
.wopt.on{border-color:#fff;background:rgba(255,255,255,.22)}
.wopt.lock{opacity:.5}
.chk{display:flex;align-items:center;gap:10px;font-size:.92rem;text-align:left;opacity:1;align-self:stretch}
.chk input{width:20px;height:20px;flex:none}
.mbtns{display:flex;gap:8px;justify-content:center}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.show{opacity:1;pointer-events:auto}
#sheetcard{width:100%;max-width:460px;margin:0 auto;box-sizing:border-box;border-radius:26px 26px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:#171717;border:1px solid rgba(255,255,255,.15);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1);max-height:80vh;overflow-y:auto}
#sheet.show #sheetcard{transform:none}
.shandle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:0 auto 10px}
.sopt{display:block;width:100%;box-sizing:border-box;padding:13px;border:none;border-radius:14px;background:rgba(255,255,255,.07);color:#fff;font-size:1rem;margin-top:6px;cursor:pointer}
.sopt.on{background:rgba(255,255,255,.22);font-weight:bold}
#shade{position:fixed;inset:0;z-index:60;pointer-events:none}
#shade.open{pointer-events:auto}
#sbg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}
#shade.open #sbg{opacity:1}
#shadecard{position:absolute;top:0;left:0;right:0;margin:0 auto;max-width:460px;box-sizing:border-box;padding:calc(18px + env(safe-area-inset-top)) 14px 10px;border-radius:0 0 30px 30px;transform:translateY(-110%);transition:transform .5s cubic-bezier(.2,.95,.25,1);background:rgba(22,22,22,.94);border:1px solid rgba(255,255,255,.15);border-top:none;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#shade.open #shadecard{transform:none}
.shuser{display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:12px}
#sh_ava{width:46px;height:46px;border:2px solid var(--c)}
#sh_nick{font-weight:bold;font-size:1.05rem;word-break:break-word}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:74px;border-radius:20px;cursor:pointer;font-size:.72rem;text-align:center;padding:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#eee;transition:transform .15s}
.tile:active{transform:scale(.93)}
.tile .ti{font-size:1.4rem}
.shgrab{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:12px auto 4px}
#banscreen{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
#banscreen.show{display:flex}
#banscreen .bcard{display:flex;flex-direction:column;gap:14px;max-width:320px}
#banscreen h2{color:#ef4444}
#bantext{white-space:pre-line;opacity:.85;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:9px 16px;border-radius:999px;z-index:70;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90%;font-size:.9rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
#intro{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;perspective:700px;overflow:hidden;animation:introBg 3.6s ease forwards}
#itext{font-size:clamp(2.4rem,15vw,5rem);font-weight:800;letter-spacing:.06em;color:#fff;transform-style:preserve-3d;animation:introText 3.6s cubic-bezier(.6,0,.3,1) forwards}
#itap{position:absolute;bottom:36px;font-size:.75rem;opacity:.35;letter-spacing:.1em}
/* ---------- плавная смена вкладок без наложения ---------- */
.view{visibility:hidden;transition:opacity .22s ease,transform .22s ease}
.view.active{visibility:visible}

/* ---------- уведомления ---------- */
#bell{position:fixed;top:calc(10px + env(safe-area-inset-top));right:60px;width:40px;height:40px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;color:#f5f5f5;cursor:pointer;z-index:6}
#bell svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nbadge{position:absolute;top:-1px;right:-1px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:#fff;font-size:.6rem;font-weight:bold;align-items:center;justify-content:center;padding:0 3px;box-sizing:border-box;display:none}
#nbadge.show{display:flex}
#umodal,#nmodal,#tmodal,#wmodal,#wlmodal{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.65);display:flex;overflow-y:auto;padding:16px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .25s ease}
#umodal.show,#nmodal.show,#tmodal.show,#wmodal.show,#wlmodal.show{opacity:1;pointer-events:auto}
#modal{z-index:60}
#u_ava{width:88px;height:88px;border:2px solid var(--c);margin:0 auto}
.nlist{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow-y:auto;width:100%;text-align:left}
.nitem{all:unset;box-sizing:border-box;width:100%;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
.nitem.unread{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.nitem .nd{width:7px;height:7px;border-radius:50%;background:#ef4444;flex:none;margin-top:5px;visibility:hidden}
.nitem.unread .nd{visibility:visible}
.nitem .nt{flex:1;word-break:break-word}
.nitem .ntime{display:block;opacity:.5;font-size:.72rem;margin-top:2px}

/* ---------- форум ---------- */
#forum .box,#thread .box{max-width:460px;align-items:stretch}
.flink{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;padding:11px 13px;border-radius:16px;cursor:pointer;text-align:left;transition:transform .15s}
.flink:active{transform:scale(.98)}
.flink .ft{font-weight:bold;font-size:.98rem;word-break:break-word;color:#fff}
.flink .fm{font-size:.75rem;opacity:.65;display:flex;gap:8px;flex-wrap:wrap}
.flink .fm .fn{color:var(--c);font-weight:bold}
.thead{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.thead h2{font-size:1.2rem;line-height:1.3}
.tpost{padding:12px 14px;border-radius:16px;text-align:left;white-space:pre-wrap;word-break:break-word;font-size:.92rem;line-height:1.45;width:100%;box-sizing:border-box}
.tr{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 12px;border-radius:14px}
.tr .trh{display:flex;gap:6px;align-items:center;font-size:.75rem;flex-wrap:wrap}
.tr .trb{font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.tr .trn{color:var(--c);font-weight:bold;background:none;border:none;padding:0;font-size:.75rem;cursor:pointer;font-family:inherit}
.tform{display:flex;flex-direction:column;gap:8px;width:100%}
#th_in{height:76px}
.rdel{all:unset;cursor:pointer;opacity:.5;margin-left:auto;font-size:.85rem;padding:0 4px}

/* ---------- чат: ответы, фото, скорость ---------- */
#chat .box{height:100%}

const INIT={},DRAW={};
INIT.matrix=()=>({d:Array.from({length:Math.ceil(ww/14)},()=>Math.random()*wh/14)});
DRAW.matrix=(c,w,h,tm,s)=>{
  c.fillStyle="rgba(0,0,0,.13)";c.fillRect(0,0,w,h);
  c.fillStyle="#22c55e";c.font="14px monospace";
  s.d.forEach((y,i)=>{c.fillText(Math.random()<.5?"0":"1",i*14,y*14);s.d[i]=(y*14>h&&Math.random()>.975)?0:y+1});
};
INIT.stars=()=>({p:Array.from({length:90},()=>({x:Math.random()*ww,y:Math.random()*wh,z:Math.random()*2+.3}))});
DRAW.stars=(c,w,h,tm,s)=>{
  c.clearRect(0,0,w,h);c.fillStyle="#fff";
  s.p.forEach(p=>{p.y+=p.z*.6;if(p.y>h){p.y=0;p.x=Math.random()*w}c.globalAlpha=.35+p.z/3;c.fillRect(p.x,p.y,p.z,p.z)});
  c.globalAlpha=1;
};
DRAW.aurora=(c,w,h,tm)=>{
  c.clearRect(0,0,w,h);
  ["rgba(74,222,128,.28)","rgba(56,189,248,.24)","rgba(168,85,247,.24)"].forEach((col,i)=>{
    const x=w*(.5+.35*Math.sin(tm/4000+i*2)),y=h*(.35+.2*Math.cos(tm/5000+i*1.7));
    const g=c.createRadialGradient(x,y,0,x,y,w*.7);
    g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=g;c.fillRect(0,0,w,h);
  });
};
DRAW.neon=(c,w,h,tm)=>{
  c.clearRect(0,0,w,h);c.strokeStyle="rgba(168,85,247,.5)";c.lineWidth=1;
  const hz=h*.42;
  for(let i=-10;i<=10;i++){c.beginPath();c.moveTo(w/2,hz);c.lineTo(w/2+i*w/5,h);c.stroke()}
  for(let k=0;k<12;k++){const f=(k+(tm/900)%1)/12;const y=hz+(h-hz)*f*f;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
};
INIT.embers=()=>({p:Array.from({length:60},()=>({x:Math.random()*ww,y:Math.random()*wh,v:Math.random()*1.2+.3,r:Math.random()*2+.5}))});
DRAW.embers=(c,w,h,tm,s)=>{
  c.clearRect(0,0,w,h);
  s.p.forEach(p=>{p.y-=p.v;p.x+=Math.sin((p.y+tm/50)/30)*.4;if(p.y<0){p.y=h;p.x=Math.random()*w}
    c.fillStyle="rgba(251,146,60,"+(.3+p.r/4)+")";c.beginPath();c.arc(p.x,p.y,p.r,0,6.3);c.fill()});
};
function startWall(){
  cancelAnimationFrame(raf);
  const c=$("wall"),ctx=c.getContext("2d");
  ww=c.width=window.innerWidth;wh=c.height=window.innerHeight;
  ctx.clearRect(0,0,ww,wh);
  if(wallId==="none"||!DRAW[wallId])return;
  wstate=INIT[wallId]?INIT[wallId]():null;
  let last=0;
  const loop=ts=>{
    raf=requestAnimationFrame(loop);
    if(document.hidden||ts-last<33)return;
    last=ts;
    DRAW[wallId](ctx,ww,wh,ts,wstate);
  };
  raf=requestAnimationFrame(loop);
}
function setWall(id){wallId=id;save("wall",id);startWall()}
function pauseWall(){
  cancelAnimationFrame(raf);raf=null;
  const c=$("wall");if(!c)return;
  c.getContext("2d").clearRect(0,0,c.width,c.height);
  c.style.display="none";
}
function resumeWall(){
  const c=$("wall");if(!c)return;
  c.style.display="";
  if(wallId!=="none")startWall();
}

function cropToData(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{
        const c=document.createElement("canvas");
        c.width=c.height=160;
        const s=Math.min(img.width,img.height);
        c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
        res(c.toDataURL("image/jpeg",0.8));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

function mapErr(e){
  const m=(e.message||"").toLowerCase();
  if(m.indexOf("banned")>-1)return "err_banned";
  if(m.indexOf("captcha")>-1)return "err_captcha_srv";
  if(m.indexOf("invalid login")>-1)return "err_bad";
  if(m.indexOf("already registered")>-1)return "err_exists";
  if(m.indexOf("different")>-1)return "err_same";
  if(m.indexOf("at least")>-1)return "err_pass";
  if(m.indexOf("rate limit")>-1||m.indexOf("security purposes")>-1)return "err_rate";
  if(m.indexOf("sending")>-1)return "err_mail";
  if(m.indexOf("database error")>-1)return "err_generic";
  return null;
}

async function doForgot(email){
  if(cfId!==null&&!cfToken){setErr("err_captcha");return}
  setErr(null);busy(true);
  try{
    const r=await sb.auth.resetPasswordForEmail(email,{captchaToken:cfToken||undefined});
    if(r.error){setErr(mapErr(r.error),r.error.message);return}
    mode="reset";$("code").value="";$("pass").value="";
    toast(t("code_sent"));
  }catch(e){setErr("err_net")}
  finally{busy(false);resetCaptcha()}
}
async function doReset(email){
  const code=$("code").value.trim(),np=$("pass").value;
  if(!/^\d{6}$/.test(code)){setErr("err_code");return}
  if(np.length<6){setErr("err_pass");return}
  setErr(null);busy(true);
  try{
    const v=await sb.auth.verifyOtp({email:email,token:code,type:"recovery"});
    if(v.error){setErr(mapErr(v.error)||"err_code");return}
    const u=await sb.auth.updateUser({password:np});
    if(u.error){setErr(mapErr(u.error),u.error.message);return}
    await loadUser((u.data&&u.data.user)||(v.data&&v.data.user));
    renderUser();mode="login";clearForm();
    toast(t("pass_changed"));
    if(await afterAuth())return;
    go("profile");
  }catch(e){setErr("err_net")}
  finally{busy(false)}
}
async function doAuth(){
  if(!sb){setErr("err_net");return}
  const email=$("email").value.trim();
  if(!email){setErr("err_email");return}
  if(mode==="forgot")return doForgot(email);
  if(mode==="reset")return doReset(email);
  const pass=$("pass").value;
  if(pass.length<6){setErr("err_pass");return}
  let nick="";
  if(mode==="reg"){
    nick=$("nick").value.trim();
    if(nick.length<2||nick.length>20){setErr("err_nick");return}
  }
  if(cfId!==null&&!cfToken){setErr("err_captcha");return}
  setErr(null);busy(true);
  try{
    if(mode==="reg"){
      const chk=await sb.rpc("nick_free",{n:nick});
      if(chk.error){setErr("err_net");return}
      if(chk.data===false){setErr("err_nick_taken");return}
    }
    const res=mode==="reg"
      ?await sb.auth.signUp({email:email,password:pass,options:{data:{nick:nick},captchaToken:cfToken||undefined}})
      :await sb.auth.signInWithPassword({email:email,password:pass,options:{captchaToken:cfToken||undefined}});
    if(res.error){setErr(mapErr(res.error),res.error.message);return}
    const u=res.data&&res.data.user,s=res.data&&res.data.session;
    if(!u||!s){setErr("check_mail");return}
    if(mode==="reg"&&pending){try{await sb.from("profiles").update({avatar:pending}).eq("id",u.id)}catch(e){}}
    await loadUser(u);
    renderUser();clearForm();
    if(await afterAuth())return;
    go("profile");
  }catch(e){setErr("err_net")}
  finally{busy(false);resetCaptcha()}
}

function chatReset(){
  chatRows=[];chatLastId=0;chatMap=new Map();chatSig="";chatPollTick=0;
  setReplying(null);setChatImg(null);
  $("msgs").textContent="";ensureEmpty();
}
async function chatInit(){
  const logged=!!user&&!!sb;
  $("chatlogin").style.display=logged?"none":"";
  $("sendrow").style.display=logged?"":"none";
  $("rooms").style.display=logged?"":"none";
  $("msgs").style.display=logged?"":"none";
  if(!logged){stopChat();return}
  if(!chatRooms.length){
    try{
      const r=await sb.rpc("chat_rooms_list");
      if(r.error)throw r.error;
      chatRooms=r.data||[];
    }catch(e){toast(t("err_generic"));return}
  }
  if(!chatRoom||!chatRooms.some(x=>x.id===chatRoom))chatRoom=chatRooms.length?chatRooms[0].id:null;
  if(!chatRoom)return;
  renderRooms();
  if(!chatRows.length)await chatLoadFull();else scrollBottom(false);
  startChat();
}
async function chatLoadFull(){
  if(!chatRoom||!sb)return;
  const room=chatRoom;
  chatBusy=true;
  try{
    const r=await sb.rpc("chat_get",{p_room:room,p_after:0,p_limit:50});
    if(r.error)throw r.error;
    if(room!==chatRoom)return;
    const rows=(r.data||[]).slice().sort((a,b)=>Number(a.id)-Number(b.id));
    chatRows=rows;chatLastId=rows.length?Number(rows[rows.length-1].id):0;
    renderMsgs();
  }catch(e){}
  finally{chatBusy=false}
}
async function chatPoll(){
  if(!chatRoom||!sb||chatBusy)return;
  const room=chatRoom;
  chatBusy=true;
  try{
    let after=chatLastId;
    for(let i=0;i<4;i++){
      const r=await sb.rpc("chat_get",{p_room:room,p_after:after,p_limit:100});
      if(r.error)throw r.error;
      if(room!==chatRoom)return;
      const rows=r.data||[];
      if(!rows.length)break;
      rows.forEach(addOrUpdate);
      after=Number(rows[rows.length-1].id);
      chatLastId=Math.max(chatLastId,after);
      if(rows.length<100)break;
    }
    if(++chatPollTick%10===0)await chatSyncFlags();
  }catch(e){}
  finally{chatBusy=false}
}
async function chatSyncFlags(){
  if(!chatRoom||!sb)return;
  const room=chatRoom;
  try{
    const r=await sb.rpc("chat_get",{p_room:room,p_after:0,p_limit:50});
    if(r.error)return;
    if(room!==chatRoom)return;
    (r.data||[]).forEach(m=>{
      const old=chatRows.find(x=>String(x.id)===String(m.id));
      if(old&&(!!old.deleted!==!!m.deleted||old.body!==m.body))addOrUpdate(m);
    });
  }catch(e){}
}
function ensureEmpty(){
  const box=$("msgs");
  const has=chatRows.some(m=>!m.pending)||chatRows.length>0;
  const ex=box.querySelector(".empty");
  if(chatRows.length){if(ex)ex.remove();return}
  if(!ex){
    const p=document.createElement("p");p.className="mail empty";p.textContent=t("chat_empty");box.appendChild(p);
  }else ex.textContent=t("chat_empty");
}
function scrollBottom(force){
  const b=$("msgs");
  if(force||chatStick||(b.scrollHeight-b.scrollTop-b.clientHeight<80)){
    b.scrollTop=b.scrollHeight;chatStick=true;
  }
}
function addOrUpdate(m){
  const id=String(m.id);
  const idx=chatRows.findIndex(x=>String(x.id)===id);
  if(idx>=0)chatRows[idx]=m;else chatRows.push(m);
  const old=chatMap.get(id);
  const nn=msgNode(m);
  if(old){old.replaceWith(nn)}else{$("msgs").appendChild(nn)}
  chatMap.set(id,nn);
  ensureEmpty();
  scrollBottom(false);
}
function removeMsg(id){
  const key=String(id);
  chatRows=chatRows.filter(x=>String(x.id)!==key);
  const n=chatMap.get(key);
  if(n)n.remove();
  chatMap.delete(key);
  ensureEmpty();
}
function msgNode(m){
  const role=m.role||"user";
  const row=document.createElement("div");
  row.className="msg "+role+(user&&m.user_id===user.id?" mine":"")+(m.pending?" pending":"");
  row.dataset.id=String(m.id);
  if(m.reply_nick||m.reply_to){
    const rp=document.createElement("div");rp.className="mrep";
    rp.textContent="↩ "+(m.reply_nick||"?")+(m.reply_excerpt?": "+m.reply_excerpt:"");
    row.appendChild(rp);
  }
  const head=document.createElement("div");head.className="mh";
  const nk=document.createElement("button");nk.type="button";nk.className="mn mnik";nk.textContent=m.nick||"?";
  nk.onclick=()=>{if(m.user_id)openProfile(m.user_id)};
  head.appendChild(nk);
  if(role!=="user"){
    const tg=document.createElement("span");tg.className="mtag";tg.textContent=role.toUpperCase();head.appendChild(tg);
  }
  const tm=document.createElement("span");tm.className="mtime";
  tm.textContent=new Date(m.created_at).toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit"});
  head.appendChild(tm);
  if(!m.deleted&&user&&!m.pending){
    const rb=document.createElement("button");rb.type="button";rb.className="mact";rb.textContent="↩";rb.title=t("f_reply_btn");
    rb.onclick=()=>setReplying(m);
    head.appendChild(rb);
    if(m.user_id===user.id||myRank()>=2){
      const d=document.createElement("button");d.type="button";d.className="mact";d.textContent="✕";
      d.onclick=()=>askConfirm(t("msg_del_q"),()=>chatDelete(m.id));
      head.appendChild(d);
    }
  }
  row.appendChild(head);
  if(m.image&&!m.deleted){
    const im=document.createElement("img");im.className="mimg";im.src=m.image;im.loading="lazy";im.alt="";
    im.onclick=()=>{try{window.open(m.image,"_blank","noopener")}catch(e){}};
    row.appendChild(im);
  }
  if(m.body||m.deleted){
    const body=document.createElement("div");body.className="mb"+(m.deleted?" del":"");
    body.textContent=m.deleted?t("msg_deleted"):m.body;
    row.appendChild(body);
  }
  return row;
}
function renderMsgs(){

function shrinkImage(file,max,q){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",q);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

async function chatSend(){
  if(!chatRoom||!user||!sb)return;
  const inp=$("msgin");
  const txt=inp.value.trim();
  if(!txt&&!chatImg)return;
  const img=chatImg,rep=chatReply;
  const tmp="tmp"+Date.now()+Math.random().toString(36).slice(2,6);
  const m={id:tmp,user_id:user.id,nick:user.nick,role:user.role,body:txt,image:img?img.url:null,
    reply_to:rep?rep.id:null,reply_nick:rep?rep.nick:null,reply_excerpt:rep?rep.excerpt:null,
    created_at:new Date().toISOString(),deleted:false,pending:true};
  inp.value="";setChatImg(null);setReplying(null);
  addOrUpdate(m);
  scrollBottom(true);
  const args={p_room:chatRoom,p_body:txt,p_device:deviceId()};
  if(rep)args.p_reply_to=rep.id;
  if(img)args.p_image=img.url;
  let ok=false,errMsg="",sentId=0;
  for(let attempt=0;attempt<3&&!ok;attempt++){
    try{
      const r=await sb.rpc("chat_send",args);
      if(r.error)throw r.error;
      ok=true;
      if(r.data)sentId=Number(r.data);
      if(sentId)chatLastId=Math.max(chatLastId,sentId);
    }catch(e){
      errMsg=((e&&e.message)||"").toLowerCase();
      if(errMsg.indexOf("slow")>-1){await wait(500*(attempt+1));continue}
      break;
    }
  }
  removeMsg(tmp);
  if(!ok){
    inp.value=txt;if(img)setChatImg(img);
    toast(t(errMsg.indexOf("slow")>-1?"chat_slow":errMsg.indexOf("banned")>-1?"err_banned":"err_generic"));
    return;
  }
  if(sentId){
    m.id=sentId;m.pending=false;
    addOrUpdate(m);
  }
  if(sentId&&rep){
    const tr=chatRows.find(x=>String(x.id)===String(rep.id));
    if(tr&&tr.user_id&&tr.user_id!==user.id){
      try{sb.rpc("chat_notify_reply",{p_target:tr.user_id,p_room:chatRoom,p_text:txt}).catch(()=>{})}catch(e){}
    }
  }
  await chatPoll();
}

/* ---------- файлы форума ---------- */
const MAX_FILE=5*1024*1024*1024;
const TUS_MIN=20*1024*1024;
const TUS_SRC="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js";
function fmtSize(n){
  n=Number(n)||0;
  if(n<1024)return n+" B";
  if(n<1048576)return Math.round(n/1024)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(1)+" MB";
  return (n/1073741824).toFixed(2)+" GB";
}
function safeName(n){return (n||"file").replace(/[^\w.\-]+/g,"_").slice(-40)}
function tooLargeErr(err){
  try{
    if(err&&(err.status===413||err.statusCode===413))return true;
    if(err&&err.originalResponse&&err.originalResponse.getStatus&&err.originalResponse.getStatus()===413)return true;
  }catch(e){}
  return false;
}
function loadTus(){
  if(window.tus)return Promise.resolve(window.tus);
  if(window.__tusLoad)return window.__tusLoad;
  window.__tusLoad=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=TUS_SRC;
    s.onload=()=>window.tus?res(window.tus):rej(new Error("tus"));
    s.onerror=()=>rej(new Error("tus"));
    document.head.appendChild(s);
  });
  return window.__tusLoad;
}
async function uploadBig(blob,name,path,type,onProgress){
  const tus=await loadTus();
  const g=await sb.auth.getSession();
  const tok=g&&g.data&&g.data.session&&g.data.session.access_token;
  if(!tok)throw new Error("auth");
  const file=blob instanceof File?blob:new File([blob],name,{type:type});
  return new Promise((res,rej)=>{
    const up=new tus.Upload(file,{
      endpoint:SUPABASE_URL+"/storage/v1/upload/resumable",
      retryDelays:[0,3000,6000,12000,25000,60000],
      headers:{authorization:"Bearer "+tok,"x-upsert":"false"},
      uploadDataDuringCreation:true,
      removeFingerprintOnSuccess:true,
      metadata:{bucketName:"forum",objectName:path,contentType:type,cacheControl:"31536000"},
      chunkSize:6*1024*1024,
      onError:e=>rej(e),
      onProgress:(b,t)=>{if(onProgress)onProgress(t?b/t:0)},
      onSuccess:()=>res()
    });
    up.start();
  });
}
async function uploadForumFile(f,onProgress){
  if(f.size>MAX_FILE)throw new Error("big");
  let blob=f,type=f.type||"application/octet-stream",name=f.name||"file";
  if(type.indexOf("image/")===0&&f.size<=25*1024*1024){
    try{blob=await shrinkImage(f,1400,0.78);type="image/jpeg"}catch(e){blob=f}
  }
  const path=user.id+"/f-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+"-"+safeName(name);
  if(blob.size>TUS_MIN)await uploadBig(blob,name,path,type,onProgress);
  else{
    const up=await sb.storage.from("forum").upload(path,blob,{contentType:type,cacheControl:"31536000"});
    if(up.error)throw up.error;
  }
  const pub=sb.storage.from("forum").getPublicUrl(path);
  if(!pub||!pub.data||!pub.data.publicUrl)throw new Error("url");
  return {name:name,url:pub.data.publicUrl,type:type,size:blob.size||f.size};
}
function renderFiles(box,files,removable){
  box.textContent="";
  files.forEach((f,i)=>{
    const it=document.createElement("div");it.className="fitem glass"+(f.uploading?" up":"");
    if(!f.uploading&&(f.type||"").indexOf("image/")===0&&f.url){
      const im=document.createElement("img");im.src=f.url;im.alt="";it.appendChild(im);
    }
    const nm=document.createElement("span");nm.className="fn2";nm.textContent=f.name||"file";it.appendChild(nm);
    const sz=document.createElement("span");sz.className="mtime";
    sz.textContent=f.uploading?(Math.round((f.pct||0)*100)+"%"):fmtSize(f.size);
    it.appendChild(sz);
    if(removable&&!f.uploading){

let shDrag=null;
function shadeH(){return $("shadecard").offsetHeight}
document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){shDrag=null;return}
  const y=e.touches[0].clientY;
  const open=$("shade").classList.contains("open");
  if(open)shDrag={sy:y,open:true,moved:false};
  else if(y<26)shDrag={sy:y,open:false,moved:false};
  else shDrag=null;
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!shDrag)return;
  const dy=e.touches[0].clientY-shDrag.sy;
  if(!shDrag.moved&&Math.abs(dy)<8)return;
  if(!shDrag.moved&&((shDrag.open&&dy>0)||(!shDrag.open&&dy<0))){shDrag=null;return}
  shDrag.moved=true;
  e.preventDefault();
  const h=shadeH();
  const y=shDrag.open?Math.max(-h,Math.min(0,dy)):Math.max(-h,Math.min(0,-h+dy));
  const c=$("shadecard");
  c.style.transition="none";
  c.style.transform="translateY("+y+"px)";
  $("sbg").style.transition="none";
  $("sbg").style.opacity=String(Math.max(0,Math.min(1,1+y/h)));
  $("shade").style.pointerEvents="auto";
},{passive:false});
function endDrag(e){
  if(!shDrag)return;
  const d=shDrag;shDrag=null;
  const c=$("shadecard");
  c.style.transition="";c.style.transform="";
  $("sbg").style.transition="";$("sbg").style.opacity="";
  $("shade").style.pointerEvents="";
  if(!d.moved)return;
  const h=shadeH();
  const ty=(e&&e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientY-d.sy:0;
  if(d.open){if(ty<-h*0.25)closeShade();else openShade()}
  else{if(ty>h*0.3)openShade();else closeShade()}
}
document.addEventListener("touchend",endDrag);
document.addEventListener("touchcancel",endDrag);

window.addEventListener("load",renderCaptcha);
async function boot(){
  try{
    if(sb){
      let r=null;
      for(let i=0;i<2;i++){
        try{r=await sb.auth.getSession();break}
        catch(e){if(i===0)await wait(700)}
      }
      if(r&&r.data&&r.data.session)await loadUser(r.data.session.user);
    }
  }catch(e){}
  renderUser();
  if(user)await afterAuth();else await checkBan();
}
buildAI();
setPrev(null);
renderUser();
applyLang();
const w0=load("wall");
if(w0&&WALLS.some(x=>x[0]===w0))setWall(w0);
if(sb){
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==="SIGNED_OUT"){
      const had=!!user;
      user=null;chatRooms=[];chatRoom=null;chatSig="";
      stopChat();chatReset();stopNotif();
      notif=[];renderNotifBadge();
      frState={friends:[],req:[]};
      const pf=$("pfriends");if(pf)pf.textContent="";
      if(had){renderUser();if(cur!=="register")go("home")}
    }else if((ev==="SIGNED_IN"||ev==="TOKEN_REFRESHED")&&s&&!user){
      loadUser(s.user).then(()=>{renderUser();if(cur==="chat")chatInit()}).catch(()=>{});
    }
  });
}
boot();
</script>
</body>
</html>
