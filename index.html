function deviceId(){

  save("did",d);setCookie("did",d);

}

const INIT={},DRAW={};
INIT.matrix=()=>({d:Array.from({length:Math.ceil(ww/14)},()=>Math.random()*wh/14)});
DRAW.matrix=(c,w,h,t,s)=>{
  c.fillStyle="rgba(0,0,0,.13)";c.fillRect(0,0,w,h);
  c.fillStyle="#22c55e";c.font="14px monospace";
  s.d.forEach((y,i)=>{c.fillText(Math.random()<.5?"0":"1",i*14,y*14);s.d[i]=(y*14>h&&Math.random()>.975)?0:y+1});
};
INIT.stars=()=>({p:Array.from({length:90},()=>({x:Math.random()*ww,y:Math.random()*wh,z:Math.random()*2+.3}))});
DRAW.stars=(c,w,h,t,s)=>{
  c.clearRect(0,0,w,h);c.fillStyle="#fff";
  s.p.forEach(p=>{p.y+=p.z*.6;if(p.y>h){p.y=0;p.x=Math.random()*w}c.globalAlpha=.35+p.z/3;c.fillRect(p.x,p.y,p.z,p.z)});
  c.globalAlpha=1;
};
DRAW.aurora=(c,w,h,t)=>{
  c.clearRect(0,0,w,h);
  ["rgba(74,222,128,.28)","rgba(56,189,248,.24)","rgba(168,85,247,.24)"].forEach((col,i)=>{
    const x=w*(.5+.35*Math.sin(t/4000+i*2)),y=h*(.35+.2*Math.cos(t/5000+i*1.7));
    const g=c.createRadialGradient(x,y,0,x,y,w*.7);
    g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=g;c.fillRect(0,0,w,h);
  });
};
DRAW.neon=(c,w,h,t)=>{
  c.clearRect(0,0,w,h);c.strokeStyle="rgba(168,85,247,.5)";c.lineWidth=1;
  const hz=h*.42;
  for(let i=-10;i<=10;i++){c.beginPath();c.moveTo(w/2,hz);c.lineTo(w/2+i*w/5,h);c.stroke()}
  for(let k=0;k<12;k++){const f=(k+(t/900)%1)/12;const y=hz+(h-hz)*f*f;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
};
INIT.embers=()=>({p:Array.from({length:60},()=>({x:Math.random()*ww,y:Math.random()*wh,v:Math.random()*1.2+.3,r:Math.random()*2+.5}))});
DRAW.embers=(c,w,h,t,s)=>{
  c.clearRect(0,0,w,h);
  s.p.forEach(p=>{p.y-=p.v;p.x+=Math.sin((p.y+t/50)/30)*.4;if(p.y<0){p.y=h;p.x=Math.random()*w}
    c.fillStyle="rgba(251,146,60,"+(.3+p.r/4)+")";c.beginPath();c.arc(p.x,p.y,p.r,0,6.3);c.fill()});
};
function startWall(){
  cancelAnimationFrame(raf);
  const c=$("wall"),ctx=c.getContext("2d");
  ww=c.width=window.innerWidth;wh=c.height=window.innerHeight;
  ctx.clearRect(0,0,ww,wh);
  if(wallId==="none"||!DRAW[wallId])return;
  wstate=INIT[wallId]?INIT[wallId]():null;
  let last=0;
  const loop=ts=>{
    raf=requestAnimationFrame(loop);
    if(document.hidden||ts-last<33)return;
    last=ts;
    DRAW[wallId](ctx,ww,wh,ts,wstate);
  };
  raf=requestAnimationFrame(loop);
}
function setWall(id){wallId=id;save("wall",id);startWall()}
window.addEventListener("resize",()=>{startWall();dockActive()});

function cropToData(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{
        const c=document.createElement("canvas");
        c.width=c.height=160;
        const s=Math.min(img.width,img.height);
        c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160);
        res(c.toDataURL("image/jpeg",0.8));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

$("pyes").onclick=async()=>{
  if(!user||!sb||pbusy)return;
  const cur=$("pcur").value,n1=$("pnew").value,n2=$("pnew2").value;
  if(!cur){perr("err_cur_pass");return}
  if(n1.length<6){perr("err_pass");return}
  if(n1!==n2){perr("err_pass_match");return}
  pbusy=true;
  try{
    const r=await sb.auth.updateUser({password:n1,current_password:cur});
    if(r.error){
      const m=(r.error.message||"").toLowerCase();
      let k="err_generic";
      if(m.indexOf("different")>-1)k="err_same";
      else if(m.indexOf("at least")>-1)k="err_pass";
      else if(m.indexOf("rate")>-1)k="err_rate";
      else if(m.indexOf("current")>-1||m.indexOf("invalid")>-1||m.indexOf("incorrect")>-1)k="err_cur_pass";
      perr(k);
      return;
    }
    closePass();
    toast(t("pass_changed"));
  }catch(e){
    perr("err_net");
  }finally{pbusy=false}
};

/* ---------- вход / регистрация ---------- */
$("swap").onclick=()=>{
  mode=(mode==="reg")?"login":(mode==="login")?"reg":(mode==="forgot")?"login":"forgot";
  setErr(null);applyMode();
};
$("forgot").onclick=()=>{mode="forgot";setErr(null);applyMode()};
function mapErr(e){
  const m=(e.message||"").toLowerCase();
  if(m.indexOf("banned")>-1)return "err_banned";
  if(m.indexOf("captcha")>-1)return "err_captcha_srv";
  if(m.indexOf("invalid login")>-1)return "err_bad";
  if(m.indexOf("already registered")>-1)return "err_exists";
  if(m.indexOf("different")>-1)return "err_same";
  if(m.indexOf("at least")>-1)return "err_pass";
  if(m.indexOf("rate limit")>-1||m.indexOf("security purposes")>-1)return "err_rate";
  if(m.indexOf("sending")>-1)return "err_mail";
  if(m.indexOf("database error")>-1)return "err_generic";
  return null;
}
function busy(b){
  $("go").disabled=b;
  if(b)$("go").textContent=t("wait");else applyMode();
}
function fmtUntil(b){
  if(!b.expires_at)return t("ban_forever");
  return t("ban_until")+" "+new Date(b.expires_at).toLocaleString(locale(),{dateStyle:"short",timeStyle:"short"});
}
function showBan(b){
  const lines=[];
  if(b.reason)lines.push(b.reason);
  lines.push(fmtUntil(b));
  $("bantext").textContent=lines.join("\n");
  $("banscreen").classList.add("show");
  try{if(sb)Promise.resolve(sb.auth.signOut()).catch(function(){})}catch(e){}
  user=null;renderUser();
}
async function checkBan(){
  if(!sb)return false;
  try{
    const r=await sb.rpc("ban_status",{d:deviceId()});
    if(r.error||!r.data||!r.data.length)return false;
    showBan(r.data[0]);return true;
  }catch(e){return false}
}
async function afterAuth(){
  try{await sb.rpc("log_device",{d:deviceId()})}catch(e){}
  return await checkBan();
}
async function doForgot(email){
  if(cfId!==null&&!cfToken){setErr("err_captcha");return}
  setErr(null);busy(true);
  try{
    const r=await sb.auth.resetPasswordForEmail(email,{captchaToken:cfToken||undefined});
    if(r.error){setErr(mapErr(r.error),r.error.message);return}
    mode="reset";$("code").value="";$("pass").value="";
    toast(t("code_sent"));
  }catch(e){setErr("err_net")}
  finally{busy(false);resetCaptcha()}
}
async function doReset(email){
  const code=$("code").value.trim(),np=$("pass").value;
  if(!/^\d{6}$/.test(code)){setErr("err_code");return}
  if(np.length<6){setErr("err_pass");return}
  setErr(null);busy(true);
  try{
    const v=await sb.auth.verifyOtp({email:email,token:code,type:"recovery"});
    if(v.error){setErr(mapErr(v.error)||"err_code");return}
    const u=await sb.auth.updateUser({password:np});
    if(u.error){setErr(mapErr(u.error),u.error.message);return}
    await loadUser((u.data&&u.data.user)||(v.data&&v.data.user));
    renderUser();mode="login";clearForm();
    toast(t("pass_changed"));
    if(await afterAuth())return;
    go("profile");
  }catch(e){setErr("err_net")}
  finally{busy(false)}
}
$("go").onclick=async()=>{
  if(!sb){setErr("err_net");return}
  const email=$("email").value.trim();
  if(!email){setErr("err_email");return}
  if(mode==="forgot")return doForgot(email);
  if(mode==="reset")return doReset(email);
  const pass=$("pass").value;
  if(pass.length<6){setErr("err_pass");return}
  let nick="";
  if(mode==="reg"){
    nick=$("nick").value.trim();
    if(nick.length<2||nick.length>20){setErr("err_nick");return}
  }
  if(cfId!==null&&!cfToken){setErr("err_captcha");return}
  setErr(null);busy(true);
  try{
    if(mode==="reg"){
      const chk=await sb.rpc("nick_free",{n:nick});
      if(chk.error){setErr("err_net");return}
      if(chk.data===false){setErr("err_nick_taken");return}
    }
    const res=mode==="reg"
      ?await sb.auth.signUp({email:email,password:pass,options:{data:{nick:nick},captchaToken:cfToken||undefined}})
      :await sb.auth.signInWithPassword({email:email,password:pass,options:{captchaToken:cfToken||undefined}});
    if(res.error){setErr(mapErr(res.error),res.error.message);return}
    const u=res.data&&res.data.user,s=res.data&&res.data.session;
    if(!u||!s){setErr("check_mail");return}
    if(mode==="reg"&&pending){try{await sb.from("profiles").update({avatar:pending}).eq("id",u.id)}catch(e){}}
    await loadUser(u);
    renderUser();clearForm();
    if(await afterAuth())return;
    go("profile");
  }catch(e){setErr("err_net")}
  finally{busy(false);resetCaptcha()}
};
async function doLogout(){
  try{if(sb)await sb.auth.signOut()}catch(e){}
  user=null;clearForm();renderUser();go("home");
}
$("logout").onclick=()=>askConfirm(t("logout_q"),doLogout);

/* ---------- админ-панель ---------- */
async function loadUsers(){
  $("ulist").textContent="";
  $("utotal").textContent=t("loading");
  try{
    const res=await Promise.all([sb.rpc("admin_users"),sb.rpc("admin_bans")]);
    if(res[0].error)throw res[0].error;
    if(res[1].error)throw res[1].error;
    allUsers=res[0].data||[];
    bansByUser={};
    (res[1].data||[]).forEach(b=>{bansByUser[b.user_id]=b});
    renderUsers();
  }catch(e){$("utotal").textContent=t("err_generic")}
}
function renderUsers(){
  const q=$("usearch").value.trim().toLowerCase();
  const list=$("ulist");list.textContent="";
  const rows=allUsers.filter(u=>!q||String(u.short_id).indexOf(q)>-1||u.nick.toLowerCase().indexOf(q)>-1||(u.email||"").toLowerCase().indexOf(q)>-1);
  $("utotal").textContent=t("total").replace("{n}",allUsers.length);
  if(!rows.length){const p=document.createElement("p");p.textContent=t("no_users");list.appendChild(p);return}
  const mr=myRank();
  rows.forEach(u=>{
    const card=document.createElement("div");card.className="ucard glass";
    const top=document.createElement("div");top.className="urow";
    const name=document.createElement("b");name.textContent="#"+u.short_id+" "+u.nick;
    const bd=document.createElement("span");bd.className="badge "+u.role;bd.textContent=u.role.toUpperCase();
    top.appendChild(name);top.appendChild(bd);
    const mail=document.createElement("div");mail.className="mail";mail.textContent=u.email;
    const date=document.createElement("div");date.className="mail";date.textContent=new Date(u.created_at).toLocaleDateString(locale());
    card.appendChild(top);card.appendChild(mail);card.appendChild(date);
    const b=bansByUser[u.id];
    if(b){
      const bi=document.createElement("div");bi.className="baninfo";
      bi.textContent=t("banned")+" · "+fmtUntil(b)+(b.reason?" · "+b.reason:"")+" · IP: "+b.ips+" · "+t("devices")+": "+b.devices;
      card.appendChild(bi);
    }
    const acts=document.createElement("div");acts.className="uacts";
    const lower=user&&u.id!==user.id&&rk(u.role)<mr;
    if(mr>=3&&lower){
      const sel=document.createElement("select");sel.className="mini sel";
      ROLES.filter(r=>rk(r)<mr).forEach(r=>{
        const o=document.createElement("option");o.value=r;o.textContent=r.toUpperCase();
        if(r===u.role)o.selected=true;sel.appendChild(o);
      });
      sel.onchange=()=>setRole(u.id,sel.value);
      acts.appendChild(sel);
    }
    if(mr>=2&&lower){
      if(b){
        const eb=document.createElement("button");eb.className="mini";eb.textContent=t("ban_edit_btn");
        eb.onclick=()=>openBan("edit",u,b);acts.appendChild(eb);
        const ub=document.createElement("button");ub.className="mini";ub.textContent=t("unban_btn");
        ub.onclick=()=>askConfirm(t("unban_q").replace("{n}",u.nick),()=>unban(b.grp));acts.appendChild(ub);
      }else{
        const bb=document.createElement("button");bb.className="mini danger";bb.textContent=t("ban_btn");
        bb.onclick=()=>openBan("new",u,null);acts.appendChild(bb);
      }
    }
    if(mr>=3&&lower){
      const db=document.createElement("button");db.className="mini danger";db.textContent=t("delete_user");
      db.onclick=()=>askConfirm(t("delete_q").replace("{n}",u.nick),()=>delUser(u.id));acts.appendChild(db);
    }
    if(acts.children.length)card.appendChild(acts);
    list.appendChild(card);
  });
}
$("usearch").oninput=renderUsers;
async function rpcDone(name,args){
  try{
    const r=await sb.rpc(name,args);
    if(r.error)throw r.error;
    toast(t("saved"));loadUsers();
  }catch(e){toast(t("err_generic"));loadUsers()}
}
const setRole=(id,role)=>rpcDone("admin_set_role",{target:id,new_role:role});
const delUser=id=>rpcDone("admin_delete_user",{target:id});
const unban=grp=>rpcDone("admin_unban",{p_grp:grp});

function syncCustom(){$("bcustom").style.display=$("bdur").value==="custom"?"":"none"}
$("bdur").onchange=syncCustom;
function openBan(m,u,b){
  banCtx={mode:m,u:u,b:b};
  $("btitle").textContent=t(m==="new"?"ban_title":"ban_edit_title").replace("{n}",u.nick);
  buildDurOptions();
  if(m==="edit"){
    if(!b.expires_at){$("bdur").value="perm";$("bcustom").value=""}
    else{$("bdur").value="custom";$("bcustom").value=Math.max(1,Math.ceil((new Date(b.expires_at).getTime()-Date.now())/60000))}
    $("breason").value=b.reason||"";
  }else{
    $("bdur").value="1440";$("bcustom").value="";$("breason").value="";
    $("bip").checked=false;$("bdev").checked=false;
  }
  const show=m==="new"?"":"none";
  $("bipw").style.display=show;$("bdevw").style.display=show;
  syncCustom();
  $("bmodal").classList.add("show");
}
$("byes").onclick=async()=>{
  if(!banCtx)return;
  const v=$("bdur").value;
  let mins=null;
  if(v==="custom"){
    mins=parseInt($("bcustom").value,10);
    if(!(mins>0)){toast(t("ban_bad_dur"));return}
  }else if(v!=="perm"){mins=parseInt(v,10)}
  const reason=$("breason").value.trim()||null;
  const ctx=banCtx;
  $("bmodal").classList.remove("show");banCtx=null;
  if(ctx.mode==="new")rpcDone("admin_ban",{p_target:ctx.u.id,p_minutes:mins,p_reason:reason,p_ip:$("bip").checked,p_device:$("bdev").checked});
  else rpcDone("admin_edit_ban",{p_grp:ctx.b.grp,p_minutes:mins,p_reason:reason});
};
$("bno").onclick=()=>{$("bmodal").classList.remove("show");banCtx=null};
$("bmodal").onclick=e=>{if(e.target===$("bmodal"))$("bno").onclick()};

/* ---------- капча, Local, запуск ---------- */
function renderCaptcha(){
  if(cfId!==null||!window.turnstile)return;
  cfId=turnstile.render("#cf",{sitekey:TURNSTILE_SITE_KEY,theme:"dark",callback:function(tk){cfToken=tk},"expired-callback":function(){cfToken=null},"error-callback":function(){cfToken=null}});
}
function resetCaptcha(){
  cfToken=null;
  try{if(cfId!==null)turnstile.reset(cfId)}catch(e){}
}
window.addEventListener("load",renderCaptcha);
function buildModels(){
  const box=$("models");
  MODELS.forEach(n=>{
    const d=document.createElement("details");d.className="mdl";
    const s=document.createElement("summary");s.textContent=n;
    const p=document.createElement("p");p.dataset.i18n="empty";
    d.appendChild(s);d.appendChild(p);box.appendChild(d);
  });
}
async function boot(){
  try{
    if(sb){
      const r=await sb.auth.getSession();
      if(r.data&&r.data.session)await loadUser(r.data.session.user);
    }
  }catch(e){}
  renderUser();
  if(user)await afterAuth();else await checkBan();
}
buildModels();
setPrev(null);
renderUser();
applyLang();
const w0=load("wall");
if(w0&&WALLS.some(x=>x[0]===w0))setWall(w0);
boot();
</script>
